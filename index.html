    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); AIUI.send.click(); }
  });
  AIUI.form.addEventListener("submit", async function(ev){
    ev.preventDefault();
    var question = AIUI.input.value.trim();
    if (!question || !S) return;
    var mod = parseInt(AIUI.select.value, 10);
    aiMsg(question, "user"); AIUI.input.value = ""; AIUI.send.disabled = true;
    var pending = aiMsg(L("aiThink"), "bot");
    WAITCB = function(w){ pending.textContent = L("waiting", {s: w}); };
    try {
      var data = await api("/api/chat", {question: question, module: mod, context: readingText(mod, question), lang: LANG, subject: plain(S.titleShown || S.title)});
      pending.textContent = data.answer || "";
    } catch (err) {
      pending.classList.add("error");
      pending.textContent = L("aiErr") + " " + (err.message || "");
    } finally {
      WAITCB = null; AIUI.send.disabled = false; AIUI.messages.scrollTop = AIUI.messages.scrollHeight; AIUI.input.focus();
    }
  });
}
function aiMsg(text, who){
  var d = document.createElement("div");
  d.className = "ai-msg " + who; d.textContent = text;
  AIUI.messages.appendChild(d); AIUI.messages.scrollTop = AIUI.messages.scrollHeight;
  return d;
}
function updateAI(){
  if (!AIUI || !S) return;
  var r = AIUI.root, set = function(id, t){ r.querySelector(id).textContent = t; };
  set("#ai-btn-t", L("aiBtn")); set("#ai-title", L("aiTitle")); set("#ai-small", L("aiSmall")); set("#ai-note", L("aiNote"));
  r.querySelector("#ai-close").setAttribute("aria-label", L("aiClose"));
  AIUI.send.setAttribute("aria-label", L("aiSend"));
  AIUI.select.setAttribute("aria-label", L("aiRef"));
  AIUI.input.setAttribute("placeholder", L("aiPh"));
  AIUI.panel.setAttribute("aria-label", L("aiTitle"));
  AIUI.select.innerHTML = '<option value="-1">' + esc(L("aiAll")) + '</option>' +
    M.map(function(m, i){ return '<option value="' + i + '">' + esc(L("aiMod", {n: i + 1, t: plain(m.t)})) + '</option>'; }).join("");
  AIUI.messages.innerHTML = "";
  aiMsg(L("aiHello"), "bot");
}

var GLOBAL_VIEWS = ["rev", "revdone", "errs", "people", "profile", "pedit"];
var SUBJ_VIEWS = ["lesson", "quiz", "level", "done", "all", "flash", "sim", "simq", "simres", "edit", "editmod"];
function render(){
  var v = st.view;
  stopExtras();
  showAI(["home", "lesson", "done", "all"].indexOf(v) >= 0);
  if (v === "lib") renderLib();
  else if (v === "new") renderNew();
  else if (v === "gen") renderGen();
  else if (v === "lesson") renderLesson();
  else if (v === "quiz") renderQuiz();
  else if (v === "level") renderLevel();
  else if (v === "done") renderDone();
  else if (v === "all") renderAll();
  else if (EXTRA_VIEWS[v]) EXTRA_VIEWS[v]();
  else { st.confirmReset = false; renderHome(); }
}

var DAY = 864e5;

}
function recordAnswer(ok, sid, mi){

  d.q++; if (ok) d.ok++;

function buildSim(n, level){
  var pools = ORIG.map(function(m, i){
    var qb = m.qb || {}, lv = level === "mix" ? Object.keys(qb) : (qb[level] ? [level] : Object.keys(qb).slice(0, 1)), seen = {}, arr = [];
    lv.forEach(function(l){ (qb[l] || []).forEach(function(q, k){
      var key = plain(q.p); if (seen[key]) return; seen[key] = 1;
      arr.push({mi: i, level: l, k: k, q: {p: clean(q.p), o: q.o.map(clean), c: q.c, e: clean(q.e)}, ord: shuffle(range(q.o.length)), sel: null});
    }); });
    return shuffle(arr);
  });

    shuffle(range(pools.length)).forEach(function(i){ if (items.length < n && pools[i].length) { items.push(pools[i].pop()); left = true; } });
  }

var PDFLIB = null;
function loadPdfLib(){
  if (self.pdfjsLib && self.pdfjsLib.GlobalWorkerOptions.workerSrc) return Promise.resolve();
  if (PDFLIB) return PDFLIB;
  var base = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
  PDFLIB = new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = base + "pdf.min.js";
    s.onload = function(){
      fetch(base + "pdf.worker.min.js").then(function(r){ if (!r.ok) throw new Error("worker"); return r.text(); }).then(function(t){
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], {type: "text/javascript"})); res();
      }).catch(function(e){ PDFLIB = null; rej(e); });
    };
    s.onerror = function(){ PDFLIB = null; rej(new Error("pdf lib")); };
    document.head.appendChild(s);
  });
  return PDFLIB;
}
async function pdfToText(file, lang, say){
  say(L("pdfRead", {p: 1, t: "…"}));
  await loadPdfLib();
  var pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  var n = Math.min(pdf.numPages, 80), pages = [], need = [];
  for (var p = 1; p <= n; p++) {
    say(L("pdfRead", {p: p, t: n}));
    var page = await pdf.getPage(p), tc = await page.getTextContent();
    var txt = tc.items.map(function(it){ return it.str + (it.hasEOL ? "\n" : " "); }).join("").replace(/[ \t]+/g, " ");
    if (txt.replace(/\s/g, "").length < 25) { need.push(p); txt = ""; }
    pages.push(txt);
  }
  if (need.length) {
    await loadOcrLib();
    var code = lang === "it" ? "ita" : "por";
    var worker = await Tesseract.createWorker(code, 1, {langPath: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/" + code + "/4.0.0_best_int"});
    try {
      for (var k = 0; k < Math.min(need.length, 15); k++) {
        say(L("pdfOcr", {p: need[k]}));
        var pg = await pdf.getPage(need[k]), vp = pg.getViewport({scale: 2});
        var cv = document.createElement("canvas"); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
        await pg.render({canvasContext: cv.getContext("2d"), viewport: vp}).promise;
        var r = await worker.recognize(cv);
        pages[need[k] - 1] = (r && r.data && r.data.text) || "";
      }
    } finally { try { await worker.terminate(); } catch (e) {} }
  }
  var all = tidyOcr(pages.join("\n\n"));
  return {text: all, pages: n};
}

async function getPub(){
  if (PUBC && Date.now() - PUBAT < 20000) return PUBC;
  PUBC = (await dbReq("GET", "pub")) || {}; PUBAT = Date.now(); return PUBC;
}
async function renderPeople(){
  var head = '<div class="top"><div class="wrap"><button type="button" class="x" id="exit" aria-label="' + esc(L("back")) + '">' + ICON.back + '</button><h2 class="tt">' + esc(L("peopleTitle")) + '</h2></div></div>';
  if (!dbOn()) { app.innerHTML = head + '<div class="wrap body center"><p class="lead">' + esc(L("peopleOff")) + '</p></div>'; $("#exit").onclick = toLib; return; }
  app.innerHTML = head + '<div class="wrap body center"><div class="spin"></div></div>';
  $("#exit").onclick = toLib;
  var my = ++NAV, all, fd;
  try { fd = await friendData(); PUBAT = 0; all = await getPub(); } catch (e) { if (my === NAV && st.view === "people") { app.innerHTML = head + '<div class="wrap body center"><p class="lead">' + esc(L("peopleErr")) + '</p></div>'; $("#exit").onclick = toLib; } return; }
  if (my !== NAV || st.view !== "people") return;
  FRN = Object.keys(fd.fr).length;
  var nameOf = function(slug){ var r = all[slug]; return (r && r.me && r.me.name) || slug; };
  var tabs = [["fr", L("frTab")], ["req", L("reqTab") + (FRN ? " (" + FRN + ")" : "")], ["find", L("findTab")]];
  var body = "";
  function row(slug, me, extra, right, cls){
    return '<div class="prow' + (cls || "") + '" data-s="' + esc(slug) + '"><button type="button" class="pgo" data-s="' + esc(slug) + '">' + (extra || "") + avatarHtml(me, "m") +
      '<span class="pn"><strong>' + esc(String(me.name || slug).slice(0, 24)) + '</strong><small>@' + esc(slug) + (me.bio ? ' · ' + esc(String(me.bio).slice(0, 50)) : "") + '</small></span></button>' + (right || "") + '</div>';
  }
  if (PTAB === "fr") {
    var rows = [], mm = getMe();
    Object.keys(fd.fl).forEach(function(k){ var r = all[k]; if (r && r.me && r.st) rows.push({slug: k, me: r.me, st: r.st}); });
    rows.push({slug: USER.slug, me: mm, st: pubStats()});
    rows.sort(function(a, b){ return metricOf(b, PT) - metricOf(a, PT); });
    var unit = PT === "week" ? "unitWeek" : PT === "streak" ? "unitStreak" : "unitXp";
    body = '<p class="lead left">' + esc(L("peopleSub2")) + '</p>' +
      '<div class="seg ptabs" role="group">' + [["week", "tabWeek"], ["streak", "tabStreak"], ["xp", "tabXp"]].map(function(t){ return '<button type="button" data-t="' + t[0] + '" aria-pressed="' + (PT === t[0]) + '">' + esc(L(t[1])) + '</button>'; }).join("") + '</div>' +
      rows.map(function(r, i){ return row(r.slug, r.me, '<span class="rk r' + (i + 1) + '">' + (i + 1) + '</span>', '<b class="pv">' + esc(L(unit, {n: metricOf(r, PT)})) + '</b>', r.slug === USER.slug ? " mine" : ""); }).join("") +
      (rows.length < 2 ? '<p class="lead">' + esc(L("frNone")) + '</p>' : "");
  } else if (PTAB === "req") {
    var inn = Object.keys(fd.fr), out = Object.keys(fd.fo);
    body = '<h3 class="sec">' + esc(L("reqIn")) + '</h3>' +
      (inn.length ? inn.map(function(k){ var r = all[k], me = (r && r.me) || {name: (fd.fr[k] && fd.fr[k].name) || k};
        return row(k, me, "", '<span class="acts"><button type="button" class="btn primary sm" data-a="ok" data-s="' + esc(k) + '">' + esc(L("accept")) + '</button><button type="button" class="btn sm" data-a="no" data-s="' + esc(k) + '">' + esc(L("decline")) + '</button></span>'); }).join("") : '<p class="cnt">' + esc(L("reqNone")) + '</p>') +
      (out.length ? '<h3 class="sec">' + esc(L("reqOut")) + '</h3>' + out.map(function(k){ var r = all[k], me = (r && r.me) || {name: k};
        return row(k, me, "", '<span class="acts"><button type="button" class="btn sm" data-a="cx" data-s="' + esc(k) + '">' + esc(L("cancel")) + '</button></span>'); }).join("") : "");
  } else {
    body = '<div class="searchbox"><input id="pq" type="search" autocomplete="off" placeholder="' + esc(L("findPh")) + '" value="' + esc(PQ) + '"></div><div id="pres"></div>';
  }
  app.innerHTML = head + '<div class="wrap body"><div class="seg ftabs" role="group">' + tabs.map(function(t){ return '<button type="button" data-p="' + t[0] + '" aria-pressed="' + (PTAB === t[0]) + '">' + esc(t[1]) + '</button>'; }).join("") + '</div>' + body + '</div>';
  $("#exit").onclick = toLib;
  var again = function(){ renderPeople(); };
  app.querySelectorAll(".ftabs button").forEach(function(b){ b.onclick = function(){ PTAB = b.getAttribute("data-p"); again(); }; });
  app.querySelectorAll(".ptabs button").forEach(function(b){ b.onclick = function(){ PT = b.getAttribute("data-t"); again(); }; });
  app.querySelectorAll(".pgo").forEach(function(b){ b.onclick = function(){ openProfile(b.getAttribute("data-s"), "people"); }; });
  app.querySelectorAll("[data-a]").forEach(function(b){ b.onclick = async function(){
    var a = b.getAttribute("data-a"), k = b.getAttribute("data-s"); b.disabled = true;
    try { if (a === "ok") await acceptReq(k); else if (a === "no") await declineReq(k); else await cancelReq(k); } catch (e) {}
    again();
  }; });
  var pq = $("#pq");
  if (pq) {
    var paint = function(){
      PQ = pq.value; var q = norm(PQ.trim()), box = $("#pres");
      if (q.length < 2) { box.innerHTML = '<p class="cnt">' + esc(L("findHint")) + '</p>'; return; }
      var res = [];
      Object.keys(all).forEach(function(k){ var r = all[k]; if (k === USER.slug || !r || !r.me) return; if (norm(k).indexOf(q) >= 0 || norm(r.me.name).indexOf(q) >= 0) res.push({slug: k, me: r.me}); });
      res = res.slice(0, 20);
      box.innerHTML = res.length ? res.map(function(r){
        var k = r.slug, btn;
        if (fd.fl[k]) btn = '<span class="tag">' + esc(L("isFr")) + '</span>';
        else if (fd.fr[k]) btn = '<button type="button" class="btn primary sm" data-q="ok" data-s="' + esc(k) + '">' + esc(L("accept")) + '</button>';
        else if (fd.fo[k]) btn = '<button type="button" class="btn sm" data-q="cx" data-s="' + esc(k) + '">' + esc(L("sent")) + '</button>';
        else btn = '<button type="button" class="btn primary sm" data-q="add" data-s="' + esc(k) + '">' + esc(L("addFr")) + '</button>';
        return row(k, r.me, "", btn);
      }).join("") : '<p class="cnt">' + esc(L("findNone")) + '</p>';
      box.querySelectorAll(".pgo").forEach(function(b){ b.onclick = function(){ openProfile(b.getAttribute("data-s"), "people"); }; });
      box.querySelectorAll("[data-q]").forEach(function(b){ b.onclick = async function(){
        var a = b.getAttribute("data-q"), k = b.getAttribute("data-s"); b.disabled = true;
        try {
          if (a === "add") { await sendReq(k); fd.fo[k] = 1; } else if (a === "cx") { await cancelReq(k); delete fd.fo[k]; } else { await acceptReq(k); fd.fl[k] = 1; delete fd.fr[k]; }
        } catch (e) {}
        paint();
      }; });
    };
    pq.oninput = paint; paint();
  }
}

var EXTRA_VIEWS = {people: renderPeople, profile: renderProfile, pedit: renderPedit, login: renderLogin, rev: renderRev, revdone: renderRevDone, errs: renderErrs, flash: renderFlash, sim: renderSimSetup, simq: renderSimq, simres: renderSimRes};

window.addEventListener("popstate", function(){
  var v = st.view;
  if (v === "lib" || v === "login") return;
  try { history.pushState({a: 1}, ""); } catch (e) {}
  if (v === "gen") return;
  NAV++;
  if (v === "editmod" && S) { st.view = "edit"; render(); window.scrollTo(0, 0); }
  else if (SUBJ_VIEWS.indexOf(v) >= 0 && S) { st.view = "home"; render(); window.scrollTo(0, 0); }
  else toLib();
});
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible" && st.view === "lib") { refreshLib(true); pullSync().then(function(ch){ if (ch && st.view === "lib") renderLib(); }); } });
setInterval(function(){ if (st.view === "lib" && document.visibilityState === "visible") refreshLib(true); }, 45000);

applyTheme();
try { fetch(CFG.API + "/health", {mode: "no-cors", cache: "no-store"}).catch(function(){}); setInterval(function(){ if (!document.hidden) fetch(CFG.API + "/health", {mode: "no-cors", cache: "no-store"}).catch(function(){}); }, 600000); } catch (e) {}
initAI(); showAI(false);
LIB = [builtMeta()];
if (USER) { renderLib(); pullSync().then(function(ch){ if (ch && st.view === "lib") renderLib(); }); } else { st.view = "login"; render(); }
refreshLib(true).then(function(){
  var m = /[#&]s=([\w-]+)/.exec(location.hash || "");
  if (USER && m && LIB.some(function(x){ return x.id === m[1]; })) openSubject(m[1]);
});

try { if ("serviceWorker" in navigator) { navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){}); if (self.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){}); } } catch (e) {}
