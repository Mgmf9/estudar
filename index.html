/* ---------- Ler texto de imagens (OCR no aparelho, gratuito) ---------- */
var OCRLIB = null;
function loadOcrLib(){
  if (self.Tesseract) return Promise.resolve();
  if (OCRLIB) return OCRLIB;
  OCRLIB = new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = function(){ res(); };
    s.onerror = function(){ OCRLIB = null; rej(new Error("ocr lib")); };
    document.head.appendChild(s);
  });
  return OCRLIB;
}
async function prepImage(file){
  var bmp = await createImageBitmap(file);
  var w = bmp.width, h = bmp.height, big = Math.max(w, h), k = 2600 / big;
  if (k > 2.2) k = 2.2;
  var c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  var x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  var ang = 0;
  try { ang = detectSkew(c); } catch (err) {}
  if (Math.abs(ang) >= 0.4) {
    var rad = ang * Math.PI / 180, cs = Math.abs(Math.cos(rad)), sn = Math.abs(Math.sin(rad));
    var r = document.createElement("canvas");
    r.width = Math.round(c.width * cs + c.height * sn); r.height = Math.round(c.width * sn + c.height * cs);
    var rx = r.getContext("2d");
    rx.fillStyle = "#fff"; rx.fillRect(0, 0, r.width, r.height);
    rx.translate(r.width / 2, r.height / 2); rx.rotate(rad); rx.drawImage(c, -c.width / 2, -c.height / 2);
    c = r; x = rx; x.setTransform(1, 0, 0, 1, 0, 0);
  }
  /* contraste em tons de cinza: desenha o resultado de volta com filtro */
  var o = document.createElement("canvas"); o.width = c.width; o.height = c.height;
  var ox = o.getContext("2d");
  try { ox.filter = "grayscale(1) contrast(1.3)"; } catch (err) {}
  ox.drawImage(c, 0, 0);

/* Descobre a inclinação das linhas de texto (graus) pela projeção horizontal dos pixels escuros */
function detectSkew(cv){
  var sc = 700 / Math.max(cv.width, cv.height), w = Math.max(1, Math.round(cv.width * sc)), h = Math.max(1, Math.round(cv.height * sc));
  var sm = document.createElement("canvas"); sm.width = w; sm.height = h;
  var sx = sm.getContext("2d"); sx.drawImage(cv, 0, 0, w, h);
  var d = sx.getImageData(0, 0, w, h).data, n = w * h, sum = 0, i;
  for (i = 0; i < n; i++) sum += d[i * 4 + 1];
  var thr = (sum / n) * 0.75, xs = [], ys = [];
  for (i = 0; i < n; i++) if (d[i * 4 + 1] < thr) { xs.push(i % w); ys.push((i / w) | 0); }
  if (xs.length < 400) return 0;
  function score(a){
    var rad = a * Math.PI / 180, cs = Math.cos(rad), sn = Math.sin(rad), off = w * 0.8, bins = new Float32Array(h + Math.ceil(w * 1.6) + 4), m;
    for (m = 0; m < xs.length; m++) bins[Math.max(0, Math.round(xs[m] * sn + ys[m] * cs + off))]++;
    var mean = xs.length / bins.length, v = 0;
    for (m = 0; m < bins.length; m++) v += (bins[m] - mean) * (bins[m] - mean);
    return v;
  }
  var best = 0, bs = -1, a;
  for (a = -12; a <= 12; a += 1) { var sc1 = score(a); if (sc1 > bs) { bs = sc1; best = a; } }
  var c0 = best;
  for (a = c0 - 1; a <= c0 + 1; a += 0.25) { var sc2 = score(a); if (sc2 > bs) { bs = sc2; best = a; } }
  return best;
}
var STOP_PT = "que não para com uma dos das por mais como são seu sua nos nas ao ou também quando foi pelo pela entre sobre".split(" ");
var STOP_IT = "che non per con una della dei delle sono come più nel nella del il gli anche ogni essere dopo nei alla alle dal dalla suo sua tra fra".split(" ");
function langScore(text, list){
  var set = {}; list.forEach(function(w){ set[w] = 1; });
  var ws = String(text || "").toLowerCase().match(/[a-zà-ú]+/g) || [], n = 0;
  ws.forEach(function(w){ if (set[w]) n++; });
  return n;
}
function textOk(text, conf){
  var ws = String(text || "").match(/[A-Za-zÀ-ú]{3,}/g) || [];
  return (ws.length >= 15) || (ws.length >= 6 && conf >= 45);
}
function tidyOcr(t){
  var lines = String(t || "").replace(/\r/g, "").replace(/-\n(?=[a-zà-ú])/g, "").split("\n").map(function(l){ return l.replace(/[ \t]+/g, " ").trim(); });
  var out = [];
  lines.forEach(function(l){
    if (!l) { if (out.length && out[out.length - 1] !== "") out.push(""); return; }
    var prev = out.length ? out[out.length - 1] : "";
    if (prev && !/[.:;!?)”"]$/.test(prev) && /^[a-zà-ú]/.test(l) && prev.length > 40) out[out.length - 1] = prev + " " + l;
    else out.push(l);
  });
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
async function ocrFiles(files, lang, say){
  say(L("imgLoad"));
  await loadOcrLib();
  var prog = 0, workers = {};
  async function getW(code, psm){
    var key = code + psm;
    if (!workers[key]) workers[key] = await Tesseract.createWorker(code, 1, {
      langPath: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/" + code + "/4.0.0_best_int",
      logger: function(m){ if (m && m.status === "recognizing text") prog = Math.round((m.progress || 0) * 100); }
    }, psm ? {tessedit_pageseg_mode: psm} : {});
    return workers[key];
  }
  /* roda leitura automática e leitura em bloco único; fica com a que tem mais palavras reais do idioma */
  async function best(cv, code){
    var cands = [];
    for (var m = 0; m < 2; m++) {
      var r = await (await getW(code, m ? "6" : "")).recognize(cv);
      var t = tidyOcr(r && r.data && r.data.text), conf = (r && r.data && r.data.confidence) || 0;
      var sc = langScore(t, code === "ita" ? STOP_IT : STOP_PT);
      cands.push({t: t, conf: conf, sc: sc, w: (t.match(/[A-Za-zÀ-ú]{3,}/g) || []).length});
    }
    cands.sort(function(a, b){ return (b.sc - a.sc) || (b.w - a.w); });
    return cands[0];
  }
  var primary = lang === "it" ? "ita" : "por", texts = [], timer = null, cur = 0;
  try {
    timer = setInterval(function(){ say(L("imgRead", {n: cur + 1, t: files.length, p: prog})); }, 300);
    for (cur = 0; cur < files.length; cur++) {
      prog = 0; say(L("imgRead", {n: cur + 1, t: files.length, p: 0}));
      var cv = await prepImage(files[cur]);
      var b1 = await best(cv, primary);
      /* idioma errado? se o outro idioma tem bem mais palavras típicas, refaz com ele */
      var other = primary === "ita" ? "por" : "ita";
      var so = langScore(b1.t, other === "ita" ? STOP_IT : STOP_PT);
      if (so >= 6 && so > b1.sc * 1.5) {
        var b2 = await best(cv, other);
        if (b2.sc >= b1.sc) { b1 = b2; primary = other; }
      }
      texts.push(textOk(b1.t, b1.conf) ? b1.t : "");
    }
  } finally {
    if (timer) clearInterval(timer);
    for (var k in workers) { try { await workers[k].terminate(); } catch (err) {} }
  }
  return texts;
}

async function runGen(){
  var my = ++NAV;
  G.run = my; G.err = ""; G.saveFail = false;
  if (!G.chunks.length) {
    if (st.view === "gen") renderGen();
    WAITCB = function(t){ if (G && my === NAV) { G.wait = t; var m = document.getElementById("gmsg"); if (m) m.textContent = t; } };
    try {
      var pl = await api("/api/plan", {title: G.title, lang: G.lang, text: G.text, count: G.count});
      if (my !== NAV) return;
      G.chunks = pl.modules; G.status = pl.modules.map(function(){ return "wait"; }); G.mods = []; G.wait = 0;
    } catch (e) {
      if (my !== NAV) return;
      G.err = e.message || String(e);
      if (st.view === "gen") renderGen();
      return;
    }
  }
  for (var i = 0; i < G.chunks.length; i++) {
    if (G.status[i] === "ok") continue;
    G.status[i] = "run"; G.wait = 0;
    if (st.view === "gen") renderGen();

        prev: G.mods.filter(Boolean).map(function(m){ return plain(m.t); }), text: relevantText(G.pieces, G.chunks[i]),

  var m = (M[i] && M[i].steps) ? M[i] : normMod(ORIG[i]);
  return "MÓDULO " + (i + 1) + ": " + plain(m.t) + "\n" + m.steps.map(function(s){ return plain(s.t) + "\n" + plain(s.h); }).join("\n");

function words(s){ return (String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").match(/[a-z0-9]{4,}/g)) || []; }
function readingText(mod, q){
  if (mod >= 0) return modText(mod).slice(0, 15000);
  var qw = words(q);
  var sc = ORIG.map(function(_, i){
    var t = " " + words(modText(i)).join(" ") + " ", s = 0;

    return [s, i];

/* ---------- Progresso neste aparelho ---------- */
/* As chaves de progresso terminam em "@nome", herança das antigas contas.
   Manter o mesmo sufixo preserva o progresso de quem já usava o site. */
var PROG_RE = /^(cad-prog-|sicurezza-lab-progress-v2|cad-srs|cad-stats|cad-tasks)/;
var PSLUG = (function(){
  var v = LS.get("cad-pslug");
  if (v) return v;
  var u = jget("cad-user", null);
  if (u && u.slug) v = String(u.slug);
  if (!v) {
    var best = 0;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i), at = k.lastIndexOf("@");
        if (at < 0 || !PROG_RE.test(k)) continue;
        var t = Number(LS.get("cad-t:" + k)) || 1;
        if (t > best) { best = t; v = k.slice(at + 1); }
      }
    } catch (e) {}
  }
  v = v || "local";
  LS.set("cad-pslug", v);
  return v;
})();
function PK(k){ return k + "@" + PSLUG; }

/* ---------- Sincronização do progresso entre aparelhos (Firebase, sem login) ---------- */
/* Uma pessoa só usa o caderno: o progresso vai para "progresso" no Firebase e cada aparelho
   fica com a versão mais nova de cada item (data em "cad-t:"). */
var SYNC_PATH = "progresso", PUSHT = null, PENDING = {};
function baseKey(k){ var suf = "@" + PSLUG; return (PROG_RE.test(k) && k.slice(-suf.length) === suf) ? k.slice(0, -suf.length) : null; }
function localProgKeys(){
  var out = [];
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (baseKey(k)) out.push(k); } } catch (e) {}
  return out;
}
function syncTouch(k){
  var b = baseKey(k); if (!b) return;
  LS.set("cad-t:" + k, String(Date.now()));
  PENDING[b] = 1; clearTimeout(PUSHT); PUSHT = setTimeout(pushSync, 1500);
}
async function pushSync(){
  if (!dbOn()) return;
  var body = {};
  Object.keys(PENDING).forEach(function(b){ var k = b + "@" + PSLUG, v = LS.get(k); if (v != null) body[b] = {t: Number(LS.get("cad-t:" + k)) || 0, v: v}; });
  PENDING = {};
  if (!Object.keys(body).length) return;
  try { await dbReq("PATCH", SYNC_PATH, body); } catch (e) { Object.keys(body).forEach(function(b){ PENDING[b] = 1; }); }
}
async function pullSync(){
  if (!dbOn()) return false;
  var rem; try { rem = await dbReq("GET", SYNC_PATH); } catch (e) { return false; }
  rem = rem || {};
  var changed = false, up = false;
  Object.keys(rem).forEach(function(b){
    var r = rem[b]; if (!r || typeof r.v !== "string" || !PROG_RE.test(b) || b.indexOf("@") >= 0) return;
    var k = b + "@" + PSLUG;
    if (LS.get(k) == null || (Number(r.t) || 0) > (Number(LS.get("cad-t:" + k)) || 0)) { LS.set(k, r.v); LS.set("cad-t:" + k, String(r.t)); changed = true; }
  });
  localProgKeys().forEach(function(k){ var b = baseKey(k), r = rem[b]; if (!r || (Number(LS.get("cad-t:" + k)) || 0) > (Number(r.t) || 0)) { PENDING[b] = 1; up = true; } });
  if (up) pushSync();
  return changed;
}

/* ---------- Backup do progresso (para guardar ou levar a outro aparelho) ---------- */
var BKMSG = "";
function exportProgress(){
  var data = {}, suf = "@" + PSLUG;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (PROG_RE.test(k) && k.slice(-suf.length) === suf) data[k.slice(0, -suf.length)] = LS.get(k);
    }
  } catch (e) {}
  var d = new Date(), name = "caderno-progresso-" + d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + ".json";
  var blob = new Blob([JSON.stringify({app: "caderno-de-estudos", v: 1, at: d.toISOString(), data: data})], {type: "application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  BKMSG = L("bkDone", {f: name}); renderLib();
}
async function importProgress(file){
  var o = null;
  try { o = JSON.parse(await file.text()); } catch (e) {}
  if (!o || o.app !== "caderno-de-estudos" || !o.data || typeof o.data !== "object") { BKMSG = L("bkBad"); renderLib(); return; }
  var keys = Object.keys(o.data).filter(function(k){ return PROG_RE.test(k) && k.indexOf("@") < 0 && typeof o.data[k] === "string"; });
  if (!keys.length) { BKMSG = L("bkBad"); renderLib(); return; }
  if (!window.confirm(L("bkAsk"))) return;
  keys.forEach(function(k){ LS.set(k + "@" + PSLUG, o.data[k]); syncTouch(k + "@" + PSLUG); });
  BKMSG = L("bkOk"); renderLib();
}
function bindBackup(){
  var f = $("#bk-file");
  $("#bk-out").onclick = exportProgress;
  $("#bk-in").onclick = function(){ f.click(); };
  f.onchange = function(){ var x = f.files && f.files[0]; f.value = ""; if (x) importProgress(x); };
}

/* ---------- Estatísticas (acerto por módulo) ---------- */
var DAY = 864e5;
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function stats(){
  var s = jget(PK("cad-stats"), null);
  if (!s || typeof s !== "object") s = {};
  if (!s.mods) s.mods = {};
  return s;
}
function recordAnswer(ok, sid, mi){
  var s = stats(), mk = sid + "|" + mi, m = s.mods[mk] || (s.mods[mk] = {q: 0, ok: 0});
  m.q++; if (ok) m.ok++;
  delete s.days; delete s.goal; delete s.exams;
  jset(PK("cad-stats"), s);
}
function accBadge(i){
  if (!S) return "";
  var m = stats().mods[S.id + "|" + i];
  if (!m || m.q < 2) return "";
  return L("accTxt", {p: Math.round(m.ok / m.q * 100)});
}

/* ---------- Revisão espaçada (caixas de Leitner) ---------- */
var INTERVALS = [0, 1, 2, 4, 8, 16, 32];
function srsAll(){ var a = jget(PK("cad-srs"), {}); return a && typeof a === "object" ? a : {}; }
function srsPut(a){
  var ks = Object.keys(a);
  if (ks.length > 800) {
    ks.filter(function(k){ return a[k].box >= 5; }).sort(function(x, y){ return (a[x].due || 0) - (a[y].due || 0); }).slice(0, ks.length - 700).forEach(function(k){ delete a[k]; });
  }
  jset(PK("cad-srs"), a);
}
function srsUpdate(key, ok, meta){
  var a = srsAll(), now = Date.now(), e = a[key];
  if (!e) {
    if (!meta) return;
    e = a[key] = {box: 0, wrong: 0, right: 0, due: now, sid: meta.sid, st: meta.st, mi: meta.mi, mt: meta.mt, q: meta.q};
  } else if (meta) { e.st = meta.st; e.mt = meta.mt; e.q = meta.q; }
  if (ok) {
    e.right++;
    if (e.box === 0 || (e.due || 0) <= now) { e.box = Math.min(e.box + 1, 6); e.due = now + INTERVALS[e.box] * DAY; }
  } else { e.wrong++; e.box = 0; e.due = now; e.lw = now; }
  srsPut(a);
}
function trackAnswer(ok, q){
  if (!S) return;
  try {
    recordAnswer(ok, S.id, st.cur);
    srsUpdate(S.id + "|" + st.cur + "|" + curLevel() + "|" + st.qi, ok, {sid: S.id, st: plain(S.titleShown || S.title), mi: st.cur, mt: plain(M[st.cur].t), q: {p: q.p, o: q.o.slice(), c: q.c, e: q.e}});
  } catch (e) {}
}
function srsList(filter){
  var a = srsAll(), out = [];
  Object.keys(a).forEach(function(k){ var e = a[k]; if (e && e.q && e.q.o && filter(e)) out.push({key: k, e: e}); });
  return out;
}
function dueList(sid){ var n = Date.now(); return srsList(function(e){ return e.due <= n && (!sid || e.sid === sid); }).sort(function(x, y){ return x.e.due - y.e.due; }); }

function dayKey(t){ var d = new Date(t == null ? Date.now() : t); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }

function daysTo(d){

function dueText(d){

}
function pendingTasks(){ return getTasks().filter(function(x){ return !x.done; }).sort(function(a, b){ return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; }); }
function subjName(id){ var m = LIB.filter(function(x){ return x.id === id; })[0]; return m ? m.title : ""; }
function agendaSummary(){

function norm(s){ return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
async function buildIndex(){

    var m = LIB[k], mods;
    try { mods = m.built ? LAB : await Store.getModules(m.id); } catch (e) { continue; }
    mods.forEach(function(md, i){
      var nm = normMod(md), mt = plain(nm.t);
      nm.steps.forEach(function(s, si){ out.push({sid: m.id, st: m.title, mi: i, si: si, mt: mt, title: plain(s.t), text: plain(s.t) + ". " + plain(s.h), kind: "s"}); });
      nm.qs.forEach(function(q){ out.push({sid: m.id, st: m.title, mi: i, si: -1, mt: mt, title: plain(q.p), text: plain(q.p) + " " + q.o.map(plain).join(" ") + " " + plain(q.e), kind: "q"}); });

async function runSearch(){

  var ws = norm(q).split(/\s+/).filter(Boolean), res = [];

    var nt = norm(it.text), nti = norm(it.title), sc = 0, ok = true;
    ws.forEach(function(w){ var c = nt.split(w).length - 1; if (!c) ok = false; sc += c + (nti.indexOf(w) >= 0 ? 3 : 0); });
    if (ok) res.push({it: it, sc: sc, pos: nt.indexOf(ws[0])});
  });
  res.sort(function(a, b){ return b.sc - a.sc; });
  SR = res.slice(0, 25).map(function(r){
    var t = r.it.text, a = Math.max(0, r.pos - 50), snip = (a > 0 ? "…" : "") + t.slice(a, a + 140) + (a + 140 < t.length ? "…" : "");

var SM = null;
function simLevels(){ var l = {}; ORIG.forEach(function(m){ Object.keys(m.qb || {}).forEach(function(k){ if ((m.qb[k] || []).length) l[k] = 1; }); }); return Object.keys(l); }
function buildSim(n, level){
  var pools = ORIG.map(function(m, i){
    var qb = m.qb || {}, lv = level === "mix" ? Object.keys(qb) : (qb[level] ? [level] : Object.keys(qb).slice(0, 1)), seen = {}, arr = [];
    lv.forEach(function(l){ (qb[l] || []).forEach(function(q, k){
      var key = plain(q.p); if (seen[key]) return; seen[key] = 1;
      arr.push({mi: i, level: l, k: k, q: {p: clean(q.p), o: q.o.map(clean), c: q.c, e: clean(q.e)}, ord: shuffle(range(q.o.length)), sel: null});
    }); });
    return shuffle(arr);
  });
  var items = [], left = true;
  while (items.length < n && left) {
    left = false;
    shuffle(range(pools.length)).forEach(function(i){ if (items.length < n && pools[i].length) { items.push(pools[i].pop()); left = true; } });
  }
  return shuffle(items);
}
function renderSimSetup(){
  var lvs = simLevels(), multi = lvs.length > 1;

    (multi ? '<div class="fld"><label for="sm-l">' + esc(L("simLevel")) + '</label><select id="sm-l"><option value="mix">' + esc(L("simMix")) + '</option><option value="easy">' + esc(L("lvEasy")) + '</option><option value="medium">' + esc(L("lvMedium")) + '</option><option value="hard">' + esc(L("lvHard")) + '</option></select></div>' : "") +

function fmtTime(ms){ var s = Math.max(0, Math.round(ms / 1000)); return pad2(Math.floor(s / 60)) + ":" + pad2(s % 60); }

/* ---------- Novo assunto: PDF e link ---------- */
var PDFLIB = null;
function loadPdfLib(){
  if (self.pdfjsLib && self.pdfjsLib.GlobalWorkerOptions.workerSrc) return Promise.resolve();
  if (PDFLIB) return PDFLIB;
  var base = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
  PDFLIB = new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = base + "pdf.min.js";
    s.onload = function(){
      fetch(base + "pdf.worker.min.js").then(function(r){ if (!r.ok) throw new Error("worker"); return r.text(); }).then(function(t){
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], {type: "text/javascript"})); res();
      }).catch(function(e){ PDFLIB = null; rej(e); });
    };
    s.onerror = function(){ PDFLIB = null; rej(new Error("pdf lib")); };
    document.head.appendChild(s);
  });
  return PDFLIB;
}
async function pdfToText(file, lang, say){
  say(L("pdfRead", {p: 1, t: "…"}));
  await loadPdfLib();
  var pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  var n = Math.min(pdf.numPages, 80), pages = [], need = [];
  for (var p = 1; p <= n; p++) {
    say(L("pdfRead", {p: p, t: n}));
    var page = await pdf.getPage(p), tc = await page.getTextContent();
    var txt = tc.items.map(function(it){ return it.str + (it.hasEOL ? "\n" : " "); }).join("").replace(/[ \t]+/g, " ");
    if (txt.replace(/\s/g, "").length < 25) { need.push(p); txt = ""; }
    pages.push(txt);
  }
  if (need.length) {
    await loadOcrLib();
    var code = lang === "it" ? "ita" : "por";
    var worker = await Tesseract.createWorker(code, 1, {langPath: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/" + code + "/4.0.0_best_int"});
    try {
      for (var k = 0; k < Math.min(need.length, 15); k++) {
        say(L("pdfOcr", {p: need[k]}));
        var pg = await pdf.getPage(need[k]), vp = pg.getViewport({scale: 2});
        var cv = document.createElement("canvas"); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
        await pg.render({canvasContext: cv.getContext("2d"), viewport: vp}).promise;
        var r = await worker.recognize(cv);
        pages[need[k] - 1] = (r && r.data && r.data.text) || "";
      }
    } finally { try { await worker.terminate(); } catch (e) {} }
  }
  var all = tidyOcr(pages.join("\n\n"));
  return {text: all, pages: n};
}

  }
