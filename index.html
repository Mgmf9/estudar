<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno de estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Caveat:wght@600;700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Estilo de aprendizado em etapas curtas: uma tela por vez, botão grande embaixo, trilha de módulos.
   Cores vêm das placas de segurança: amarelo (ação), azul (seleção), verde (acerto/progresso), vermelho (erro). */
:root{
  --bg:#f5f7fa;
  --surface:#ffffff;
  --ink:#1b2631;
  --muted:#5d6b77;
  --line:#dde3e9;
  --line-dark:#c2cbd3;
  --soft:#edf1f5;
  --accent:#ffc800;
  --accent-edge:#d19f00;
  --on-accent:#1b2631;
  --ok:#1f9d63;
  --ok-edge:#157a4a;
  --ok-bg:#dff5e9;
  --bad:#d6403a;
  --bad-edge:#a92f2a;
  --bad-bg:#fde6e4;
  --blue:#1b6fc9;
  --blue-bg:#e3effb;
  --s-yellow:#ffc800;
  --s-blue:#1b6fc9;
  --s-red:#d6403a;
  --s-green:#1f9d63;
  --f:"Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1519;--surface:#172128;--ink:#eaf0f3;--muted:#9dadb6;--line:#2a3a43;--line-dark:#3b4e5a;--soft:#1c2a32;
    --ok:#34c47f;--ok-edge:#1f9d63;--ok-bg:#123225;--bad:#ff6b62;--bad-edge:#c9443d;--bad-bg:#3a1c1c;
    --blue:#5aa6f0;--blue-bg:#14283b;--s-blue:#4d94e0;--s-red:#ee5a50;--s-green:#34a873;--accent-edge:#b88b00;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1519;--surface:#172128;--ink:#eaf0f3;--muted:#9dadb6;--line:#2a3a43;--line-dark:#3b4e5a;--soft:#1c2a32;
  --ok:#34c47f;--ok-edge:#1f9d63;--ok-bg:#123225;--bad:#ff6b62;--bad-edge:#c9443d;--bad-bg:#3a1c1c;
  --blue:#5aa6f0;--blue-bg:#14283b;--s-blue:#4d94e0;--s-red:#ee5a50;--s-green:#34a873;--accent-edge:#b88b00;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
#app{min-height:100dvh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:640px;margin-inline:auto;padding-inline:20px}
button{font-family:var(--f)}

/* Botões grandes com borda inferior, para tocar fácil */
.btn{font-weight:800;font-size:17px;line-height:1.1;border-radius:16px;padding:15px 22px;min-height:54px;cursor:pointer;border:2px solid var(--line-dark);background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line-dark);transition:transform .08s,box-shadow .08s}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 0 0 transparent}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-edge)}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-edge)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 4px 0 var(--bad-edge)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--blue);padding-inline:14px}
.btn.wide{flex:1}
.btn[disabled]{background:var(--soft);border-color:var(--soft);color:var(--muted);box-shadow:none;cursor:not-allowed;opacity:.8}
.btn:focus-visible,.opt:focus-visible,.mod:focus-visible,.x:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* Tela inicial: trilha */
.hero{padding-block:28px 8px;display:flex;flex-direction:column;gap:10px}
.kicker{margin:0;font-weight:800;font-size:15px;color:var(--muted)}
h1{margin:0;font-weight:900;font-size:clamp(28px,7vw,36px);line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-weight:600;max-width:42ch}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:6px 14px}
.pill svg{color:var(--accent-edge)}
.pbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .5s ease}
.path{display:flex;flex-direction:column;gap:12px;padding-block:18px 24px}
.mod{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:20px;padding:14px;cursor:pointer}
.mod:active:not([disabled]){transform:translateY(4px);box-shadow:none}
.mod.cur{border-color:var(--accent);box-shadow:0 4px 0 var(--accent-edge)}
.mod.done{border-color:var(--line)}
.mod.locked{opacity:.55;cursor:not-allowed;box-shadow:none}
.node{position:relative;width:62px;height:62px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.node .sign{width:36px;height:36px}
.mod.locked .node .sign{filter:grayscale(1);opacity:.55}
.badge{position:absolute;right:-3px;bottom:-3px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--surface);background:var(--ok);color:#fff}
.badge.lock{background:var(--muted)}
.mt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.mt strong{font-size:18px;font-weight:800;line-height:1.2}
.meta{font-size:14.5px;font-weight:600;color:var(--muted);line-height:1.3}
.st{font-weight:800;font-size:14px;color:var(--blue);flex:none}
.kind{align-self:flex-start;font-size:13px;font-weight:800;border-radius:99px;padding:1px 10px;color:#fff}
.k-w{background:#c79500;color:#1b2631}
.k-m{background:var(--s-blue)}
.k-p{background:var(--s-red)}
.k-s{background:var(--s-green)}
.foot{padding-block:0 28px;display:flex;justify-content:center}

/* Barra de baixo (sempre visível) */
.bar{position:sticky;bottom:0;margin-top:auto;background:var(--bg);border-top:2px solid var(--line);padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .wrap{display:flex;gap:12px}
.bar.sheet{border-top-width:0}
.bar.sheet.ok{background:var(--ok-bg)}
.bar.sheet.no{background:var(--bad-bg)}
.sheet .wrap{flex-direction:column;gap:12px}
.sheet strong{display:block;font-size:20px;font-weight:900}
.sheet.ok strong{color:var(--ok)}
.sheet.no strong{color:var(--bad)}
.sheet p{margin:4px 0 0;font-weight:600;font-size:16px;line-height:1.45}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}

/* Lição */
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:6;padding-block:14px 8px}
.top .wrap{display:flex;align-items:center;gap:12px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none}
.x:hover{background:var(--soft)}
.segs{flex:1;display:flex;gap:5px}
.segs i{flex:1;height:10px;border-radius:99px;background:var(--line)}
.segs i.on{background:var(--ok)}
.segs i.now{background:var(--accent)}
.body{flex:1;padding-block:14px 28px;display:flex;flex-direction:column;gap:18px}
.crumb{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:15px;color:var(--muted)}
h2{margin:0;font-weight:900;font-size:clamp(26px,6vw,32px);line-height:1.15;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:14px;font-size:18px;line-height:1.55}
.stack p{margin:0}
.item{border:2px solid var(--line);border-radius:18px;background:var(--surface);padding:14px 16px}
.item h4{margin:0 0 6px;font-size:19px;font-weight:800;line-height:1.25}
.item h4 small{font-weight:600;color:var(--muted);font-size:15px}
.item dl{margin:0}
.item dt{font-size:14px;font-weight:800;color:var(--muted);margin-top:10px}
.item dt:first-child{margin-top:0}
.item dd{margin:2px 0 0}
.item dd.it{font-style:italic}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.pts li{position:relative;padding-left:26px}
.pts li::before{content:"";position:absolute;left:3px;top:.55em;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.num{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:n}
.num li{counter-increment:n;position:relative;padding-left:40px;min-height:30px}
.num li::before{content:counter(n);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px;display:grid;place-items:center}
.key{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border:2px solid var(--accent);border-radius:18px;padding:14px 16px}
.key .lbl{display:block;font-weight:900;margin-bottom:2px}
.stack b{font-weight:800}

/* Perguntas */
.q{font-size:clamp(22px,5vw,26px);line-height:1.3;font-weight:800}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;font-weight:700;font-size:17px;line-height:1.4;color:var(--ink);background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:16px;padding:14px 16px;cursor:pointer}
.opt .l{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-dark);display:grid;place-items:center;flex:none;font-size:14px;font-weight:800;color:var(--muted)}
.opt span:last-child{min-width:0}
.opt:hover:not([disabled]){background:var(--soft)}
.opt.sel{border-color:var(--blue);background:var(--blue-bg);box-shadow:0 3px 0 var(--blue)}
.opt.sel .l{border-color:var(--blue);background:var(--blue);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 3px 0 var(--ok)}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 var(--bad)}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}

/* Fim de módulo */
.center{align-items:center;text-align:center;justify-content:center}
.center .sign{width:96px;height:96px}
.xp{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:22px;background:color-mix(in srgb,var(--accent) 25%,var(--surface));border:2px solid var(--accent);border-radius:99px;padding:8px 20px}
.lead{margin:0;color:var(--muted);font-weight:600;max-width:36ch}
.recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%;text-align:left}
.recap div{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:600;font-size:15px;line-height:1.3;color:var(--muted)}
.recap b{display:block;font-size:20px;font-weight:900;color:var(--ink)}

@media (prefers-reduced-motion:reduce){.pbar i,.btn{transition:none}}

/* ===== Camada visual refinada ===== */
:root {
  --bg: #f3f6fb;
  --surface: #ffffff;
  --ink: #172334;
  --muted: #65758b;
  --line: #e1e8f0;
  --line-dark: #c7d2df;
  --soft: #f0f4f9;
  --accent: #ffd447;
  --accent-edge: #d5a91c;
  --blue: #316ee8;
  --blue-bg: #eaf1ff;
  --ok: #159765;
  --ok-edge: #0d754d;
  --ok-bg: #e3f8ee;
  --bad: #dc4c55;
  --bad-edge: #ad303a;
  --bad-bg: #fff0f0;
}
body {
  background:
    radial-gradient(ellipse at 10% 0%, rgba(49,110,232,.08), transparent 34rem),
    radial-gradient(ellipse at 100% 12%, rgba(255,212,71,.12), transparent 28rem),
    var(--bg);
  letter-spacing: .005em;
}
.wrap { max-width: 720px; padding-inline: 22px; }
.hero { padding-block: 38px 12px; gap: 13px; }
.kicker {
  display: inline-flex; align-items: center; gap: 8px;
  text-transform: uppercase; letter-spacing: .12em; font-size: 12px;
  color: var(--blue);
}
h1 { letter-spacing: -.035em; line-height: 1.04; }
.sub { font-size: 16px; line-height: 1.65; }
.stats { gap: 8px; margin-top: 10px; }
.pill {
  border: 1px solid var(--line); box-shadow: 0 3px 10px rgba(25,45,75,.035);
  padding: 8px 13px; font-size: 13px;
}
.pbar { height: 9px; margin-top: 10px; background: #e4eaf2; }
.pbar i { background: linear-gradient(90deg, #159765, #4acb93); }
.path { gap: 14px; padding-block: 22px 30px; }
.mod {
  border: 1px solid var(--line); border-radius: 22px; padding: 16px;
  box-shadow: 0 5px 16px rgba(29,49,78,.045);
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.mod:hover:not([disabled]) { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(29,49,78,.09); }
.mod.cur { border-color: var(--accent-edge); box-shadow: 0 0 0 3px rgba(255,212,71,.18), 0 7px 20px rgba(29,49,78,.06); }
.node { width: 58px; height: 58px; background: linear-gradient(145deg, #f5f7fb, #e8eef7); }
.mt strong { font-size: 17px; letter-spacing: -.015em; }
.meta { font-size: 13px; line-height: 1.45; }
.kind { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; }
.btn {
  border-radius: 14px; min-height: 52px; font-size: 15px;
  box-shadow: 0 3px 0 var(--line-dark);
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:hover:not([disabled]) { filter: brightness(.985); }
.btn.primary { background: linear-gradient(135deg, #ffdc65, #ffd447); }
.bar {
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(16px); border-top: 1px solid var(--line);
}
.top { backdrop-filter: blur(14px); border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.x { background: var(--surface); border: 1px solid var(--line); }
.segs { gap: 6px; }
.segs i { height: 7px; }
.body { gap: 20px; padding-block: 20px 34px; }
.crumb { font-size: 12px; text-transform: uppercase; letter-spacing: .075em; }
h2 { letter-spacing: -.025em; }
.stack { gap: 15px; font-size: 16px; line-height: 1.7; }
.item {
  border: 1px solid var(--line); border-radius: 18px; padding: 17px 18px;
  box-shadow: 0 4px 15px rgba(29,49,78,.035);
}
.item h4 { font-size: 17px; letter-spacing: -.01em; }
.item dt { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
.key {
  border: 1px solid rgba(213,169,28,.55);
  background: linear-gradient(135deg, rgba(255,212,71,.20), rgba(255,212,71,.07));
  border-radius: 18px; padding: 17px 18px;
}
.key .lbl { text-transform: uppercase; letter-spacing: .09em; font-size: 12px; }
.pts { gap: 12px; }
.pts li { padding-left: 25px; }
.pts li::before { width: 8px; height: 8px; top: .7em; background: var(--blue); }
.num { gap: 13px; }
.num li::before { background: var(--blue); color: white; }
.q { letter-spacing: -.025em; }
.opts { gap: 11px; }
.opt {
  border: 1px solid var(--line); border-radius: 17px; padding: 15px 16px;
  box-shadow: 0 3px 0 #e4eaf2; transition: border-color .12s ease, background .12s ease, transform .12s ease;
}
.opt:hover:not([disabled]) { transform: translateY(-1px); border-color: #a9c1f8; }
.opt .l { border: 1px solid var(--line-dark); background: var(--soft); }
.opt.sel { border-color: var(--blue); box-shadow: 0 3px 0 var(--blue); }
.opt.right { border-color: var(--ok); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); box-shadow: 0 3px 0 var(--bad); }
.sheet .wrap { padding-block: 3px; }
.sheet strong { letter-spacing: -.02em; }
.recap { gap: 12px; }
.recap div { border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(29,49,78,.04); padding: 15px; }
.recap b { color: var(--blue); letter-spacing: -.025em; }
.xp { box-shadow: 0 4px 15px rgba(29,49,78,.04); }
@media (min-width: 600px) {
  .hero { padding-top: 48px; }
  .path { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; }
  .mod { height: 100%; }
  .node { width: 52px; height: 52px; }
  .node .sign { width: 30px; height: 30px; }
}
@media (max-width: 420px) {
  .wrap { padding-inline: 16px; }
  .hero { padding-top: 27px; }
  .mod { gap: 11px; padding: 12px; border-radius: 18px; }
  .node { width: 48px; height: 48px; }
  .node .sign { width: 29px; height: 29px; }
  .mt strong { font-size: 15px; }
  .meta { font-size: 12px; }
  .st { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .mod, .opt, .btn { transition: none; }
  .mod:hover:not([disabled]), .opt:hover:not([disabled]) { transform: none; }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220; --surface: #121d2d; --ink: #edf3fc; --muted: #9cacc2;
    --line: #26364b; --line-dark: #354961; --soft: #1a2940;
    --blue: #79a7ff; --blue-bg: #192b49; --ok-bg: #123427; --bad-bg: #3a2028;
  }
  body {
    background: radial-gradient(ellipse at 10% 0%, rgba(49,110,232,.13), transparent 34rem), var(--bg);
  }
  .node { background: linear-gradient(145deg, #1a2940, #152236); }
  .pbar { background: #26364b; }
  .opt { box-shadow: 0 3px 0 #26364b; }
  .opt.sel { box-shadow: 0 3px 0 var(--blue); }
  .opt.right { box-shadow: 0 3px 0 var(--ok); }
  .opt.wrong { box-shadow: 0 3px 0 var(--bad); }
}


/* Assistente de IA */
#ai-assistant-root{font-family:var(--f);position:relative;z-index:30}
.ai-launch{position:fixed;right:22px;bottom:22px;border:0;border-radius:999px;padding:14px 18px;background:linear-gradient(135deg,#2563eb,#6d5dfc);color:#fff;font:800 15px var(--f);box-shadow:0 12px 30px #1d4ed855;cursor:pointer;display:flex;align-items:center;gap:9px;transition:transform .18s,box-shadow .18s}
.ai-launch:hover{transform:translateY(-2px);box-shadow:0 16px 34px #1d4ed866}
.ai-launch svg{width:21px;height:21px}
.ai-panel{position:fixed;right:22px;bottom:84px;width:min(410px,calc(100vw - 28px));height:min(590px,calc(100dvh - 120px));background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 70px #0b122044;display:none;overflow:hidden;flex-direction:column;color:var(--ink)}
.ai-panel.open{display:flex}
.ai-head{padding:16px 17px;background:linear-gradient(135deg,#1d4ed8,#6656e8);color:white;display:flex;align-items:center;gap:11px}
.ai-avatar{width:40px;height:40px;border-radius:14px;background:#ffffff25;display:grid;place-items:center;font-size:22px}
.ai-head-copy{flex:1;min-width:0}.ai-head-copy strong{display:block;font-size:16px}.ai-head-copy small{opacity:.85;font-size:12px}
.ai-close{border:0;background:#ffffff22;color:white;width:34px;height:34px;border-radius:10px;font-size:22px;cursor:pointer}
.ai-controls{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.ai-controls select{min-width:0;flex:1;border:1px solid var(--line-dark);border-radius:10px;background:var(--surface);color:var(--ink);padding:8px;font:700 13px var(--f)}
.ai-messages{padding:13px;display:flex;flex-direction:column;gap:10px;flex:1;overflow:auto;background:var(--bg)}
.ai-msg{max-width:91%;padding:10px 12px;border-radius:15px;font-size:14px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere}
.ai-msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.ai-msg.user{align-self:flex-end;background:var(--blue);color:white;border-bottom-right-radius:5px}
.ai-msg.error{border-color:var(--bad);color:var(--bad)}
.ai-compose{padding:11px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;background:var(--surface)}
.ai-compose textarea{resize:none;max-height:110px;min-height:43px;flex:1;min-width:0;border:1px solid var(--line-dark);border-radius:13px;padding:11px 12px;background:var(--bg);color:var(--ink);font:600 14px var(--f)}
.ai-send{width:44px;height:43px;flex:none;border:0;border-radius:13px;background:#315ee8;color:white;font-size:20px;cursor:pointer}
.ai-send:disabled{opacity:.5;cursor:wait}
.ai-note{padding:0 13px 9px;color:var(--muted);font-size:11px;background:var(--surface)}
@media(max-width:520px){.ai-launch{right:14px;bottom:14px;padding:13px 15px}.ai-panel{right:8px;bottom:72px;width:calc(100vw - 16px);height:min(72dvh,620px)}}


/* ===== Caderno de estudos ===== */
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;color:var(--muted);font:800 13px var(--f);padding:8px 13px;border-radius:10px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(25,45,75,.14)}
.seg button:focus-visible,.plus:focus-visible,.back:focus-visible,.nb:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.plus{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(135deg,#ffdc65,#ffd447);color:var(--on-accent);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 var(--accent-edge);transition:transform .1s,box-shadow .1s}
.plus:active{transform:translateY(4px);box-shadow:none}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:800 14px var(--f);padding:8px 14px 8px 10px;border-radius:99px;cursor:pointer;min-height:40px}
.back:hover{background:var(--soft)}
.libhead{padding-block:34px 4px;display:flex;flex-direction:column;gap:14px}
.libhead .row2{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.banner{background:var(--blue-bg);border:1px solid color-mix(in srgb,var(--blue) 35%,transparent);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;line-height:1.45}
.banner.warn{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-color:color-mix(in srgb,var(--accent-edge) 60%,transparent)}

/* Estante */
.shelf{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:20px 48px}
@media(min-width:600px){.shelf{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nb{position:relative;display:flex;align-items:stretch;width:100%;min-height:128px;text-align:left;background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 93%,var(--c)));color:var(--ink);border:1px solid var(--line);border-radius:8px 22px 22px 8px;overflow:hidden;cursor:pointer;padding:0;font-family:var(--f);box-shadow:0 6px 18px rgba(29,49,78,.07);transition:transform .16s ease,box-shadow .16s ease}
.nb:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(29,49,78,.12)}
.nb:active{transform:translateY(1px)}
.nb .spine{flex:none;width:44px;background:var(--c);position:relative}
.nb .spine::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--surface) 0 5px,transparent 5.6px) 50% 10px/100% 30px repeat-y;opacity:.92}
.nb .cover{flex:1;min-width:0;padding:16px 18px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.nb strong{font-size:19px;font-weight:900;line-height:1.2;letter-spacing:-.015em;overflow-wrap:anywhere}
.nb .meta{font-size:13px;font-weight:700;color:var(--muted)}
.nb .mb{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.nb .mb i{display:block;height:100%;background:var(--c);border-radius:99px}
.nb.add{border:2px dashed var(--line-dark);background:transparent;box-shadow:none;align-items:center;justify-content:center;gap:12px;color:var(--blue);font-weight:900;font-size:17px;border-radius:22px;min-height:96px}
.nb.add:hover{background:var(--blue-bg);transform:none;box-shadow:none}
.nb.add svg{flex:none}

/* Formulário */
.fld{display:flex;flex-direction:column;gap:7px;font-weight:800;font-size:14px;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:600 16px/1.5 var(--f);color:var(--ink);background:var(--surface);border:1.5px solid var(--line-dark);border-radius:14px;padding:12px 14px;width:100%;min-width:0}
.fld textarea{min-height:240px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);border-color:var(--blue)}
.cnt{font-size:13px;font-weight:700;color:var(--muted)}
.msg{margin:0;font-weight:700;font-size:15px}
.msg.err{color:var(--bad)}
.lead.left{text-align:left;max-width:60ch}
.top .tt{font-size:20px;line-height:1.2}

/* Carregamento e geração */
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--blue);animation:sp .85s linear infinite;flex:none}
.spin.sm{width:18px;height:18px;border-width:3px}
@keyframes sp{to{transform:rotate(360deg)}}
.body.center .pbar{width:min(320px,100%)}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.gi{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:700;min-width:0}
.gi .gtxt{min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.gi .gtxt small{font-weight:600;color:var(--muted);font-size:12.5px}
.gdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--soft);font-weight:900;color:var(--muted);font-size:14px}
.gi.ok .gdot{background:var(--ok);color:#fff}
.gi.err{border-color:var(--bad)}
.gi.err .gdot{background:var(--bad);color:#fff}
.gi.run{border-color:var(--accent-edge);box-shadow:0 0 0 3px rgba(255,212,71,.2)}
.bar .wrap{flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.nb,.plus{transition:none}.nb:hover{transform:none}}

/* Assistente acima da barra inferior, para não cobrir o botão Continuar */
.ai-launch{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.ai-panel{bottom:calc(160px + env(safe-area-inset-bottom,0px));height:min(560px,calc(100dvh - 190px))}
@media(max-width:520px){
  .ai-launch{right:14px;bottom:calc(100px + env(safe-area-inset-bottom,0px));padding:12px 14px}
  .ai-panel{right:8px;bottom:calc(160px + env(safe-area-inset-bottom,0px));width:calc(100vw - 16px);height:min(66dvh,540px)}
}

/* =====================================================================
   SKIN "Folha quadriculada": papel, tinta azul-marinho, marca-texto, post-it
   ===================================================================== */
:root{
  --paper:#fbf8f0; --bg:#fbf8f0; --surface:#ffffff; --soft:#f3eee1;
  --ink:#14213d; --muted:#5b6682; --line:#e4dccb; --line-dark:#cfc5ad;
  --edge:#14213d; --shadow-c:#14213d; --grid:rgba(43,80,216,.075);
  --accent:#ffd23f; --accent-edge:#14213d; --on-accent:#14213d;
  --blue:#2b50d8; --blue-bg:#e8edff;
  --ok:#0f8f68; --ok-edge:#14213d; --ok-bg:#d9f4e8;
  --bad:#d93b55; --bad-edge:#14213d; --bad-bg:#ffe3e7;
  --f:"Figtree","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fd:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --fh:"Caveat","Bradley Hand","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1424; --bg:#0e1424; --surface:#161e35; --soft:#1c2642; --ink:#f1f3fa; --muted:#a3accb;
    --line:#26325a; --line-dark:#37467a; --edge:#6b7bb3; --shadow-c:#050812; --grid:rgba(150,170,255,.07);
    --accent:#ffd23f; --accent-edge:#050812; --on-accent:#14213d;
    --blue:#8ba5ff; --blue-bg:#1b2750; --ok:#3fd49e; --ok-bg:#0f3025; --bad:#ff7088; --bad-bg:#40202b;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1424; --bg:#0e1424; --surface:#161e35; --soft:#1c2642; --ink:#f1f3fa; --muted:#a3accb;
  --line:#26325a; --line-dark:#37467a; --edge:#6b7bb3; --shadow-c:#050812; --grid:rgba(150,170,255,.07);
  --accent:#ffd23f; --accent-edge:#050812; --on-accent:#14213d;
  --blue:#8ba5ff; --blue-bg:#1b2750; --ok:#3fd49e; --ok-bg:#0f3025; --bad:#ff7088; --bad-bg:#40202b;
}
body{
  font-family:var(--f);font-size:17px;letter-spacing:0;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  background-position:-1px -1px;
}
h1,h2,.q,.nb strong,.mt strong,.item h4,.sheet strong,.recap b,.xp{font-family:var(--fd)}
.wrap{max-width:700px}

/* Cabeçalhos */
.kicker{font-family:var(--fh);font-weight:700;font-size:25px;line-height:1;text-transform:none;letter-spacing:0;color:var(--blue);transform:rotate(-1.5deg);transform-origin:left;display:inline-block}
h1{font-family:var(--fd);font-weight:800;font-size:clamp(34px,9vw,52px);line-height:1;letter-spacing:-.04em;position:relative;padding-bottom:16px;font-variation-settings:"opsz" 96}
h1::after{content:"";position:absolute;left:0;bottom:0;width:92px;height:10px;background:var(--accent);border-radius:3px;transform:rotate(-1.2deg);box-shadow:2px 2px 0 var(--shadow-c)}
h2{font-family:var(--fd);font-weight:800;letter-spacing:-.03em;line-height:1.08}
.sub{font-size:17px;line-height:1.55;color:var(--muted);font-weight:500;max-width:44ch}
.crumb{font-family:var(--fh);font-size:22px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--blue)}
.libhead{padding-block:34px 6px}
.hero{padding-block:30px 10px}

/* Botões: carimbo com sombra dura */
.btn{font-family:var(--f);font-weight:800;font-size:16px;letter-spacing:.01em;border:2px solid var(--edge);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:3px 3px 0 var(--shadow-c);min-height:54px;padding:14px 22px;transition:transform .1s,box-shadow .1s}
.btn:hover:not([disabled]){filter:none;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow-c)}
.btn:active:not([disabled]){transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow-c)}
.btn.primary{background:var(--accent);border-color:var(--edge);color:var(--on-accent);box-shadow:3px 3px 0 var(--shadow-c)}
.btn.good{background:var(--ok);border-color:var(--edge);color:#fff;box-shadow:3px 3px 0 var(--shadow-c)}
.btn.bad{background:var(--bad);border-color:var(--edge);color:#fff;box-shadow:3px 3px 0 var(--shadow-c)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--blue);min-height:44px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.btn.ghost:hover:not([disabled]){transform:none;box-shadow:none}
.btn[disabled]{background:var(--soft);border:2px dashed var(--line-dark);color:var(--muted);box-shadow:none;opacity:1}
.btn:focus-visible,.opt:focus-visible,.mod:focus-visible,.x:focus-visible,.nb:focus-visible,.plus:focus-visible,.back:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* Seletor de idioma */
.seg{background:var(--surface);border:2px solid var(--edge);border-radius:12px;padding:3px;gap:2px;box-shadow:2px 2px 0 var(--shadow-c)}
.seg button{font-family:var(--f);font-weight:800;font-size:13.5px;border-radius:8px;padding:7px 14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.back{border:2px solid var(--edge);background:var(--surface);border-radius:12px;box-shadow:2px 2px 0 var(--shadow-c);font-weight:800;padding:7px 14px 7px 9px}
.back:hover{background:var(--soft)}
.plus{width:52px;height:52px;border-radius:14px;background:var(--accent);border:2px solid var(--edge);box-shadow:3px 3px 0 var(--shadow-c);color:var(--on-accent);transition:transform .1s,box-shadow .1s}
.plus:hover{transform:translate(-1px,-1px) rotate(-4deg);box-shadow:4px 4px 0 var(--shadow-c)}
.plus:active{transform:translate(3px,3px);box-shadow:none}
.banner{border:2px dashed var(--line-dark);background:var(--surface);border-radius:12px;font-weight:600}
.banner.warn{background:#fff6cf;border-color:#c9a21c;color:#3c3200}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner.warn{background:#3a3213;color:#ffeaa0;border-color:#a68a20}}
:root[data-theme="dark"] .banner.warn{background:#3a3213;color:#ffeaa0;border-color:#a68a20}

/* Pílulas e progresso */
.pill{border:2px solid var(--edge);border-radius:10px;background:var(--surface);box-shadow:2px 2px 0 var(--shadow-c);padding:6px 12px;font-weight:800;font-size:14px}
.pill svg{color:#e0a800}
.pbar{height:16px;border:2px solid var(--edge);border-radius:99px;background:var(--surface);margin-top:12px;padding:0}
.pbar i{background:repeating-linear-gradient(135deg,var(--ok) 0 8px,color-mix(in srgb,var(--ok) 78%,#fff) 8px 16px);border-radius:99px;min-width:0}

/* Estante de cadernos */
.shelf{gap:22px;padding-block:26px 56px}
@media(min-width:600px){.shelf{gap:26px}}
.nb{border:2px solid var(--edge);border-radius:6px 18px 18px 6px;background:color-mix(in srgb,var(--c) 14%,var(--surface));box-shadow:5px 5px 0 var(--shadow-c);min-height:150px;overflow:visible;transition:transform .12s,box-shadow .12s}
.nb:hover{transform:translate(-2px,-2px) rotate(-.4deg);box-shadow:7px 7px 0 var(--shadow-c)}
.nb:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--shadow-c)}
.nb .spine{width:46px;border-right:2px solid var(--edge);border-radius:4px 0 0 4px}
.nb .spine::after{background:radial-gradient(circle at 50% 50%,var(--paper) 0 6px,var(--edge) 6px 7.5px,transparent 8px) 50% 12px/100% 32px repeat-y;opacity:1}
.nb .cover{padding:18px 18px 16px 18px;position:relative}
.nb .cover::before{content:"";position:absolute;right:16px;top:-9px;width:54px;height:20px;background:rgba(255,210,63,.85);border:1.5px solid var(--edge);transform:rotate(4deg);opacity:.95}
.nb strong{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.08;font-variation-settings:"opsz" 48}
.nb .meta{font-size:13.5px;font-weight:700;color:var(--ink);opacity:.72}
.nb .mb{height:12px;border:2px solid var(--edge);background:var(--surface);border-radius:99px}
.nb .mb i{background:var(--c);border-radius:0 99px 99px 0}
.nb.add{border:2px dashed var(--edge);background:transparent;box-shadow:none;color:var(--ink);font-family:var(--fh);font-size:27px;font-weight:700;min-height:110px;border-radius:18px;gap:12px}
.nb.add:hover{background:var(--surface);box-shadow:none;transform:rotate(-.6deg)}
.nb.add .cover::before{display:none}
.nb.add svg{color:var(--blue)}

/* Trilha de módulos */
.path{gap:16px;padding-block:24px 32px}
.mod{border:2px solid var(--edge);border-radius:16px;background:var(--surface);box-shadow:4px 4px 0 var(--shadow-c);padding:14px 16px;transition:transform .12s,box-shadow .12s;gap:14px}
.mod:hover:not([disabled]){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow-c)}
.mod:active:not([disabled]){transform:translate(4px,4px);box-shadow:0 0 0 var(--shadow-c)}
.mod.cur{background:color-mix(in srgb,var(--accent) 30%,var(--surface));box-shadow:4px 4px 0 var(--shadow-c)}
.mod.cur::before{content:"▶";position:absolute;left:-13px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--ink);background:var(--accent);border:2px solid var(--edge);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;padding-left:2px;font-size:10px}
.mod{position:relative}
.mod.done{background:color-mix(in srgb,var(--ok) 11%,var(--surface))}
.mod.locked{opacity:1;border-style:dashed;border-color:var(--line-dark);background:transparent;box-shadow:none;color:var(--muted)}
.mod.locked .mt strong{color:var(--muted)}
.node{width:60px;height:60px;border-radius:14px;background:var(--paper);border:2px solid var(--edge);box-shadow:2px 2px 0 var(--shadow-c)}
.mod.locked .node{box-shadow:none;border-style:dashed;border-color:var(--line-dark);background:transparent}
.badge{right:-9px;bottom:-9px;width:26px;height:26px;border:2px solid var(--edge)}
.badge.lock{background:var(--surface);color:var(--muted)}
.mt strong{font-size:18.5px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.meta{font-size:14px;color:var(--muted);font-weight:500;line-height:1.35}
.st{font-family:var(--fh);font-size:21px;font-weight:700;color:var(--blue)}
.kind{font-family:var(--f);font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;border:1.5px solid var(--edge);border-radius:6px;padding:2px 8px;color:#fff}
.k-w{background:var(--accent);color:var(--on-accent)}
.k-m{background:#2b50d8}.k-p{background:#d93b55}.k-s{background:#0f8f68}

/* Barra de baixo e topo da lição */
.bar{background:var(--paper);backdrop-filter:none;border-top:2px solid var(--edge);padding-top:14px}
.bar.sheet.ok{background:var(--ok-bg);border-top:2px solid var(--edge)}
.bar.sheet.no{background:var(--bad-bg);border-top:2px solid var(--edge)}
.bar.sheet{border-top-width:2px}
.top{background:var(--paper);backdrop-filter:none;border-bottom:2px solid var(--edge);padding-block:12px}
.x{background:var(--surface);border:2px solid var(--edge);border-radius:12px;box-shadow:2px 2px 0 var(--shadow-c);color:var(--ink)}
.x:hover{background:var(--soft)}
.segs{gap:5px}
.segs i{height:14px;border:2px solid var(--edge);background:var(--surface);border-radius:5px}
.segs i.on{background:var(--ok)}
.segs i.now{background:var(--accent)}
.top .tt{font-family:var(--fd);font-weight:800;letter-spacing:-.02em}

/* Conteúdo da lição */
.stack{font-size:17.5px;line-height:1.65;gap:16px}
.stack p{max-width:62ch}
.item{border:2px solid var(--edge);border-radius:14px;background:var(--surface);box-shadow:4px 4px 0 var(--shadow-c);padding:16px 18px}
.item h4{font-size:19px;font-weight:800;letter-spacing:-.02em}
.item dt{font-family:var(--fh);font-size:20px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--blue);margin-top:8px}
.pts li::before{width:11px;height:11px;border-radius:3px;top:.55em;background:var(--accent);border:2px solid var(--edge);transform:rotate(12deg)}
.num li::before{border:2px solid var(--edge);background:var(--surface);color:var(--ink);font-family:var(--fd);font-weight:800;box-shadow:2px 2px 0 var(--shadow-c)}
.key{background:#fff0a6;color:#2a2400;border:0;border-radius:3px 3px 3px 18px;padding:20px 20px 18px;transform:rotate(-.7deg);box-shadow:3px 4px 0 rgba(20,33,61,.22),0 12px 20px -10px rgba(20,33,61,.35);position:relative}
.key::before{content:"";position:absolute;top:-10px;left:50%;width:68px;height:22px;margin-left:-34px;background:rgba(255,255,255,.55);border:1px solid rgba(20,33,61,.15);transform:rotate(-2deg)}
.key .lbl{font-family:var(--fh);font-size:25px;font-weight:700;text-transform:none;letter-spacing:0;line-height:1;color:#7a2e00;margin-bottom:4px}
.key b{color:#14213d}
:root[data-theme="dark"] .key{background:#ffe27a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .key{background:#ffe27a}}

/* Perguntas */
.q{font-weight:800;letter-spacing:-.03em;font-size:clamp(23px,5.5vw,29px);line-height:1.2}
.opts{gap:13px}
.opt{border:2px solid var(--edge);border-radius:14px;background:var(--surface);box-shadow:3px 3px 0 var(--shadow-c);font-weight:600;font-size:17px;padding:14px 16px;transition:transform .1s,box-shadow .1s,background .1s}
.opt:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow-c);border-color:var(--edge);background:var(--surface)}
.opt:active:not([disabled]){transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow-c)}
.opt .l{width:32px;height:32px;border-radius:9px;border:2px solid var(--edge);background:var(--paper);color:var(--ink);font-family:var(--fd);font-weight:800}
.opt.sel{background:var(--blue-bg);border-color:var(--edge);box-shadow:3px 3px 0 var(--blue)}
.opt.sel .l{background:var(--blue);border-color:var(--edge);color:#fff}

function key(l,t){return '<div class="key"><span class="lbl">'+l+'</span>'+t+'</div>';}
function Q(p,ok,bad,e){return {p:p,o:[ok].concat(bad),c:0,e:e};}

/* s = tipo de sinal: w risco, m obrigação, p proibição, s prevenção */
var KIND = {w:"Risco", m:"Obrigação", p:"Proibição", s:"Prevenção"};

var LAB = [
/* 1 */
{ s:"w", t:"Rischio e rischi infortunistici", tag:"Definições e acidentes de laboratório",
 steps:[

  {t:"Cortes e queimaduras", h:
    it("Ferite da taglio","(cortes)",dl([["Quando acontece","Uso de instrumentos cortantes; manipulação de vidraria não íntegra; quebra acidental de material que vira cortante."],["Da non fare","Submeter vidro a esforço mecânico impróprio; usar mal um instrumento cortante."]]))+
    it("Ustioni termiche","(queimaduras)",dl([["Quando acontece","Contato com superfícies quentes; uso de chamas livres; trabalho com vidro; gelo seco e nitrogênio líquido."],["Da non fare","Usar chamas, aquecedores, material aquecido, gelo seco ou N₂ líquido <b>sem DPI</b>."]]))},

 ],
 qs:[

/* ---------- Limpeza de HTML vindo da IA, do banco ou de traduções ---------- */
var OK_TAGS = {P:1, B:1, I:1, STRONG:1, EM:1, DIV:1, SPAN:1, H4:1, SMALL:1, DL:1, DT:1, DD:1, UL:1, OL:1, LI:1, BR:1};
var OK_CLASS = /^(item|key|lbl|pts|num|it)$/;
function clean(html){
  var doc = new DOMParser().parseFromString("<body>" + String(html == null ? "" : html) + "</body>", "text/html");
  (function walk(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(ch){
      if (ch.nodeType === 3) return;
      if (ch.nodeType !== 1) { node.removeChild(ch); return; }
      if (!OK_TAGS[ch.tagName]) { node.replaceChild(doc.createTextNode(ch.textContent), ch); return; }
      Array.prototype.slice.call(ch.attributes).forEach(function(a){
        var n = a.name.toLowerCase();
        if (n === "class" && a.value.split(/\s+/).every(function(c){ return OK_CLASS.test(c); })) return;
        if (n === "style" && ch.tagName === "OL" && /^counter-reset:\s*n\s+\d+;?$/.test(a.value)) return;
        ch.removeAttribute(a.name);
      });
      walk(ch);
    });
  })(doc.body);
  return doc.body.innerHTML;
}
function normMod(m){
  return {
    s: ["w", "m", "p", "s"].indexOf(m.s) >= 0 ? m.s : "m", t: clean(m.t), tag: clean(m.tag),
    steps: (m.steps || []).map(function(x){ return {t: clean(x.t), h: clean(x.h)}; }),
    qs: (m.qs || []).map(function(q){ return {p: clean(q.p), o: (q.o || []).map(clean), c: Number(q.c) || 0, e: clean(q.e)}; })
  };
}

/* ---------- Divisão do texto em módulos ---------- */
function chunkText(raw){
  var text = String(raw || "").replace(/\r/g, "").trim();
  if (!text) return [];
  var paras = text.split(/\n[ \t]*\n+/).map(function(p){ return p.trim(); }).filter(Boolean);
  if (paras.length < 4) {
    var byLine = text.split(/\n+/).map(function(p){ return p.trim(); }).filter(Boolean);
    if (byLine.length > paras.length) paras = byLine;
  }
  var parts = [];
  paras.forEach(function(p){
    if (p.length <= 1800) { parts.push(p); return; }
    var sents = p.match(/[^.!?…]+[.!?…]+["')\]]*\s*|[^.!?…]+$/g) || [p];
    var cur = "";
    sents.forEach(function(s){
      if ((cur + s).length > 1500 && cur) { parts.push(cur.trim()); cur = s; } else cur += s;
    });
    if (cur.trim()) parts.push(cur.trim());
  });
  function isNum(p){ return p.length < 140 && /^(\d+[.)]|[IVX]+[.)]|#{1,3}\s|módulo\s*\d|capítulo\s*\d|parte\s*\d)/i.test(p) && p.split("\n").length === 1; }
  function isHead(p){ return isNum(p) || (p.length < 90 && !/[.!?;,]$/.test(p) && p.split(/\s+/).length <= 12); }
  function pack(target){
    var out = [], cur = "";
    parts.forEach(function(p){
      var big = cur.length >= target * 0.45;
      if (cur && ((cur.length + p.length + 2 > target && cur.length >= 600) || (isNum(p) && cur.length >= 350) || (isHead(p) && big))) { out.push(cur); cur = ""; }
      cur += (cur ? "\n\n" : "") + p;
    });
    if (cur) out.push(cur);
    if (out.length > 1 && out[out.length - 1].length < 300) { var last = out.pop(); out[out.length - 1] += "\n\n" + last; }
    return out;
  }
  var target = 1300, out = pack(target);
  while (out.length > MAXMOD && target < 20000) { target = Math.round(target * 1.3); out = pack(target); }
  return out;
}

/* Escolhe os trechos do texto do estudante mais ligados a um módulo planejado */
function relevantText(pieces, c){
  if (!pieces || !pieces.length) return "";
  var q = words([c.title, c.focus].concat(c.points || []).join(" "));
  var sc = pieces.map(function(p, i){
    var t = " " + words(p).join(" ") + " ", s = 0;
    q.forEach(function(w){ if (t.indexOf(" " + w) >= 0) s++; });
    return [s, i];
  });
  sc.sort(function(a, b){ return b[0] - a[0] || a[1] - b[1]; });
  var chosen = [], size = 0;
  sc.forEach(function(x){ if (x[0] > 0 && size + pieces[x[1]].length <= 4200) { chosen.push(x[1]); size += pieces[x[1]].length; } });
  if (!chosen.length) { var all = pieces.join("\n\n"); return all.length <= 4200 ? all : pieces[0].slice(0, 4200); }
  chosen.sort(function(a, b){ return a - b; });
  return chosen.map(function(i){ return pieces[i]; }).join("\n\n");
}

/* ---------- Backend (IA) ---------- */
var WAITCB = null;
async function api(path, body){
  var tries = 0;
  for (;;) {
    var r, data;
    try {
      r = await fetch(CFG.API.replace(/\/$/, "") + path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      data = await r.json().catch(function(){ return {}; });
    } catch (e) {
      if (++tries > 2) throw new Error(L("errNet"));
      await sleep(3000); continue;
    }
    if (r.status === 429 && tries < 6) {
      tries++;
      var w = Math.min(Math.max(Number(data.retryAfter) || 15, 5), 60);
      if (WAITCB) WAITCB(w);
      await sleep(w * 1000); continue;
    }
    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    return data;
  }
}

async function translateBatch(obj, lang){
  var keys = Object.keys(obj);
  var data = await api("/api/translate", {lang: lang, items: obj});
  var got = data.items || {};
  var missing = keys.filter(function(k){ return typeof got[k] !== "string" || !got[k].trim(); });
  if (missing.length > keys.length / 2) throw new Error(L("errTr"));
  if (missing.length) {
    var sub = {}; missing.forEach(function(k){ sub[k] = obj[k]; });
    try {
      var d2 = await api("/api/translate", {lang: lang, items: sub});
      missing.forEach(function(k){ if (d2.items && typeof d2.items[k] === "string" && d2.items[k].trim()) got[k] = d2.items[k]; });
    } catch (e) { /* mantém o original nas chaves que faltarem */ }
  }
  var res = {};
  keys.forEach(function(k){ res[k] = (typeof got[k] === "string" && got[k].trim()) ? got[k] : obj[k]; });
  return res;
}
var LT = {}, LTBAD = {};
function withTimeout(p, ms){
  return new Promise(function(res, rej){
    var t = setTimeout(function(){ rej(new Error("timeout")); }, ms);
    Promise.resolve(p).then(function(v){ clearTimeout(t); res(v); }, function(x){ clearTimeout(t); rej(x); });
  });
}
async function getLocalTranslator(lang, allowDownload){
  try {
    if (!("Translator" in self) || (lang !== "it" && lang !== "pt") || LTBAD[lang]) return null;
    if (LT[lang]) return LT[lang];
    var pair = {sourceLanguage: lang === "it" ? "pt" : "it", targetLanguage: lang};
    var av = await withTimeout(Translator.availability(pair), 3000);
    if (av === "unavailable") { LTBAD[lang] = true; return null; }
    if (av !== "available" && !allowDownload) return null;
    LT[lang] = await withTimeout(Translator.create(pair), allowDownload && av !== "available" ? 600000 : 10000);
    return LT[lang];
  } catch (x) { if (x && x.message === "timeout") LTBAD[lang] = true; return null; }
}
async function translateHtmlLocal(t, html){
  var doc = new DOMParser().parseFromString("<div>" + html + "</div>", "text/html"), root = doc.body.firstChild;
  var nodes = [], w = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  while (w.nextNode()) { if (/\S/.test(w.currentNode.nodeValue)) nodes.push(w.currentNode); }
  for (var i = 0; i < nodes.length; i++) {
    var s = nodes[i].nodeValue, core = s.trim();
    var r = await withTimeout(t.translate(core), 15000);
    nodes[i].nodeValue = s.match(/^\s*/)[0] + r + s.match(/\s*$/)[0];
  }
  return root.innerHTML;
}
async function translateMap(items, lang, onProg){
  var lt = await getLocalTranslator(lang, false);
  if (lt) {
    try {
      var ks = Object.keys(items), o2 = {};
      for (var q = 0; q < ks.length; q++) {
    if (onProg) onProg(q, ks.length);
        o2[ks[q]] = await translateHtmlLocal(lt, String(items[ks[q]]));
      }
      if (onProg) onProg(ks.length, ks.length);
      return o2;
    } catch (x) { LTBAD[lang] = true; delete LT[lang]; /* se o tradutor do navegador falhar, usa a IA */ }
  }
  var keys = Object.keys(items), batches = [], cur = {}, size = 0, out = {};
  keys.forEach(function(k){
    var v = String(items[k]);
    if (size + v.length > 3200 && Object.keys(cur).length) { batches.push(cur); cur = {}; size = 0; }
    cur[k] = v; size += v.length;
  });
  if (Object.keys(cur).length) batches.push(cur);
  for (var b = 0; b < batches.length; b++) {
    if (onProg) onProg(b, batches.length);
    var res = await translateBatch(batches[b], lang);
    Object.keys(res).forEach(function(k){ out[k] = res[k]; });
  }
  if (onProg) onProg(batches.length, batches.length);
  return out;
}

/* ---------- Armazenamento: Firebase (compartilhado) ou este aparelho ---------- */
function dbOn(){ return !!CFG.DB; }
async function dbReq(method, p, body){
  var opt = {method: method};
  if (body !== undefined) { opt.headers = {"Content-Type": "application/json"}; opt.body = JSON.stringify(body); }
  var r = await fetch(CFG.DB.replace(/\/+$/, "") + "/" + p + ".json", opt);
  if (!r.ok) throw new Error("db " + r.status);
  return method === "GET" ? r.json() : null;
}
var TRM = {};
var Store = {
  list: async function(){
    if (dbOn()) {
      try {
        var v = await dbReq("GET", "meta"); v = v || {};
        jset("cad-cache-meta", v);
        return {items: objVals(v), offline: false};
      } catch (e) { return {items: objVals(jget("cad-cache-meta", {})), offline: true}; }
    }
    return {items: objVals(jget("cad-local-meta", {})), offline: false};
  },
  getModules: async function(id){
    if (dbOn()) {
      try {
        var v = await dbReq("GET", "modules/" + id);
        if (v == null) throw new Error("vazio");
        var arr = objVals(v, true).map(function(s){ return JSON.parse(s); });
        jset("cad-cache-mod:" + id, arr);
        return arr;
      } catch (e) { var c = jget("cad-cache-mod:" + id, null); if (c) return c; throw e; }
    }
    var l = jget("cad-local-mod:" + id, null);
    if (!l) throw new Error("não encontrado");
    return l;
  },
  save: async function(meta, mods){
    if (dbOn()) {
      for (var i = 0; i < mods.length; i++) await dbReq("PUT", "modules/" + meta.id + "/" + i, JSON.stringify(mods[i]));
      await dbReq("PUT", "meta/" + meta.id, meta);
      jset("cad-cache-mod:" + meta.id, mods);
    } else {
      if (!jset("cad-local-mod:" + meta.id, mods)) throw new Error("sem espaço neste aparelho");
      var m = jget("cad-local-meta", {}); m[meta.id] = meta; jset("cad-local-meta", m);
    }
  },
  remove: async function(id){
    if (dbOn()) {
      await dbReq("DELETE", "meta/" + id);
      try { await dbReq("DELETE", "modules/" + id); await dbReq("DELETE", "tr/" + id); } catch (e) {}
    } else {
      var m = jget("cad-local-meta", {}); delete m[id]; jset("cad-local-meta", m); LS.del("cad-local-mod:" + id);
    }
    LS.del("cad-cache-mod:" + id); LS.del(progKey(id));
  },
  getTr: async function(sub, lang, k){
    var kk = (sub.built ? "v1_" : "") + k, mk = sub.id + "|" + lang + "|" + kk;
    if (TRM[mk]) return TRM[mk];
    var c = jget("cad-tr:" + mk, null);
    if (c) { TRM[mk] = c; return c; }
    if (dbOn()) {
      try {
        var v = await dbReq("GET", "tr/" + sub.id + "/" + lang + "/" + kk);
        if (v) { var o = JSON.parse(v); TRM[mk] = o; jset("cad-tr:" + mk, o); return o; }
      } catch (e) {}
    }
    return null;
  },
  getQx: async function(sub, i, level, lang){
    var k = i + "_" + level + "_" + lang, mk = sub.id + "|" + k;
    var c = jget("cad-qx:" + mk, null);
    if (c) return c;
    if (dbOn()) {
      try { var v = await dbReq("GET", "qx/" + sub.id + "/" + k); if (v) { var o = JSON.parse(v); jset("cad-qx:" + mk, o); return o; } } catch (x) {}
    }
    return null;
  },
  putQx: async function(sub, i, level, lang, obj){
    var k = i + "_" + level + "_" + lang, mk = sub.id + "|" + k;
    jset("cad-qx:" + mk, obj);
    if (dbOn()) { try { await dbReq("PUT", "qx/" + sub.id + "/" + k, JSON.stringify(obj)); } catch (x) {} }
  },
  putTr: async function(sub, lang, k, obj){
    var kk = (sub.built ? "v1_" : "") + k, mk = sub.id + "|" + lang + "|" + kk;
    TRM[mk] = obj; jset("cad-tr:" + mk, obj);
    if (dbOn()) { try { await dbReq("PUT", "tr/" + sub.id + "/" + lang + "/" + kk, JSON.stringify(obj)); } catch (e) {} }
  }
};

  LANG = l; jset("cad-lang", l);
  if (l !== "orig") getLocalTranslator(l, true);
  if (st.view === "lib") { renderLib(); ensureTitleTr(); }
  else if (S && st.view === "home") openSubject(S.id);
}

function renderLoading(title, sub, back){
  st.view = "loading"; showAI(false);
  app.innerHTML = '<div class="wrap body center"><div class="spin" aria-hidden="true"></div><h2>' + esc(title) + '</h2>' +
    '<p class="lead" id="lsub">' + esc(sub || "") + '</p>' +
    '<div class="pbar" id="lbar" hidden><i style="width:0%"></i></div></div>' +
    '<div class="bar"><div class="wrap"><button type="button" class="btn wide" id="lback">' + esc(L("cancel")) + '</button></div></div>';
  WAITCB = function(w){ var e = document.getElementById("lsub"); if (e) e.textContent = L("waiting", {s: w}); };
  $("#lback").onclick = function(){ NAV++; (back || toLib)(); };
}
function setLoadProg(done, total){
  var b = document.getElementById("lbar");
  if (!b) return;
  b.hidden = total < 2;
  b.firstChild.style.width = Math.round(done / Math.max(total, 1) * 100) + "%";
}
function showError(title, detail, actions){
  st.view = "err"; showAI(false); WAITCB = null;
  app.innerHTML = '<div class="wrap body center"><h2>' + esc(title) + '</h2><p class="lead">' + esc(detail || "") + '</p></div>' +
    '<div class="bar"><div class="wrap">' + actions.map(function(a, i){
      return '<button type="button" class="btn' + (a.primary ? ' primary wide' : '') + '" data-a="' + i + '">' + esc(a.label) + '</button>';
    }).join("") + '</div></div>';
  app.querySelectorAll("[data-a]").forEach(function(b){ b.onclick = function(){ actions[Number(b.getAttribute("data-a"))].fn(); }; });
}

/* ---------- Biblioteca ---------- */
function builtMeta(){ return {id: "lab", title: "Sicurezza nei laboratori scolastici", origin: "mix", n: LAB.length, color: 0, built: true, createdAt: 0}; }
function hasTT(m){ return !!((m.tt && m.tt[LANG]) || TT[m.id + "|" + LANG]); }
function titleFor(m){
  if (LANG === "orig" || m.origin === LANG) return m.title;
  return (m.tt && m.tt[LANG]) || TT[m.id + "|" + LANG] || m.title;
}
async function refreshLib(silent){
  var res = await Store.list();
  var items = res.items.filter(function(x){ return x && x.id && x.title; }).sort(function(a, b){ return (a.createdAt || 0) - (b.createdAt || 0); });
  LIB = [builtMeta()].concat(items);
  LIBOFF = res.offline;
  if (st.view === "lib" && !(document.activeElement && document.activeElement.id === "sq")) renderLib();
  ensureTitleTr();
}
async function ensureTitleTr(){
  if (LANG === "orig" || TBUSY) return;
  var lang = LANG;
  LIB.forEach(function(m){
    if (m.origin !== lang && !hasTT(m)) { var c = LS.get("cad-tt:" + m.id + ":" + lang); if (c) TT[m.id + "|" + lang] = c; }
  });
  var need = LIB.filter(function(m){ return m.origin !== lang && !hasTT(m); });
  if (st.view === "lib") renderLib();
  if (!need.length) return;
  TBUSY = true;
  try {
    var items = {}; need.forEach(function(m){ items[m.id] = m.title; });
    var res = await translateMap(items, lang);
    need.forEach(function(m){
      TT[m.id + "|" + lang] = res[m.id];
      LS.set("cad-tt:" + m.id + ":" + lang, res[m.id]);
      if (dbOn() && !m.built) dbReq("PUT", "meta/" + m.id + "/tt/" + lang, res[m.id]).catch(function(){});
    });
  } catch (e) { /* mantém os títulos originais */ }
  TBUSY = false;
  if (st.view === "lib") renderLib();
}
function toLib(){
  if (!USER) { S = null; M = []; ORIG = []; st.view = "login"; render(); return; }
  S = null; M = []; ORIG = []; st.view = "lib"; showAI(false); WAITCB = null;
  renderLib(); window.scrollTo(0, 0); refreshLib(true);
}
function renderLib(){
  var cards = LIB.map(function(m){
    var p = readProg(m.id), n = m.n || 0, u = Math.min(Number(p.unlocked) || 0, n), pct = n ? Math.round(u / n * 100) : 0;
    var title = titleFor(m), col = PALETTE[(m.color || 0) % PALETTE.length];
    return '<button type="button" class="nb" data-id="' + esc(m.id) + '" style="--c:' + col + '" aria-label="' + esc(title) + '">' +
      '<span class="spine" aria-hidden="true"></span>' +
      '<span class="cover"><strong>' + esc(title) + '</strong>' +
      '<span class="meta">' + esc(L("modsN", {n: n})) + ' · ' + esc(L("pctDone", {p: pct})) + '</span>' +
      '<span class="mb" aria-hidden="true"><i style="width:' + pct + '%"></i></span></span></button>';
  }).join("");
  app.innerHTML =
    '<div class="wrap libhead">' +
      '<div class="topline"><p class="kicker">' + esc(L("libKicker")) + '</p>' +
      '<span class="hdr-r">' + acctBtn() + '<button type="button" class="plus" id="newtop" aria-label="' + esc(L("newSub")) + '">' + ICON.plus + '</button></span></div>' +
      '<h1>' + esc(L("app")) + '</h1>' +
      '<p class="sub">' + esc(L("libSub")) + '</p>' +
      '<div class="row2">' + langBar() + '</div>' + dashHtml() +
      (!dbOn() ? '<div class="banner warn">' + esc(L("noDb")) + '</div>' : "") +
      (LIBOFF ? '<div class="banner warn">' + esc(L("offline")) + '</div>' : "") +
    '</div>' +
    '<div class="wrap shelf">' + cards +
      '<button type="button" class="nb add" id="newcard">' + ICON.plus + '<span>' + esc(L("newSub")) + '</span></button></div>';
  bindLang(); bindDash();
  app.querySelectorAll(".nb[data-id]").forEach(function(b){ b.onclick = function(){ openSubject(b.getAttribute("data-id")); }; });
  $("#newtop").onclick = $("#newcard").onclick = function(){ st.form = st.form || {title: "", text: "", lang: LANG === "it" ? "it" : "pt"}; go("new"); };
}

/* ---------- Abrir assunto e idioma ---------- */
async function applyLang(my){
  var el = effLang();
  if (!el) {
    M = S.built ? ORIG : ORIG.map(normMod);
    S.titleShown = S.title; S.recap = S.built ? RECAP_LAB : null;
    return;
  }
  var idx = await Store.getTr(S, el, "index");
  if (!idx) {
    var sub = document.getElementById("lsub"); if (sub) sub.textContent = L("translatingSub");
    var items = {title: S.title};
    ORIG.forEach(function(m, i){ items["m" + i + "t"] = m.t; items["m" + i + "a"] = m.tag; });
    if (S.built) RECAP_LAB.forEach(function(r, i){ items["r" + i + "b"] = r.b; items["r" + i + "t"] = r.t; });
    var res = await translateMap(items, el, setLoadProg);
    if (my !== NAV) return;
    idx = {
      title: res.title,
      mods: ORIG.map(function(m, i){ return {t: res["m" + i + "t"], tag: res["m" + i + "a"]}; }),
      recap: S.built ? RECAP_LAB.map(function(r, i){ return {b: res["r" + i + "b"], t: res["r" + i + "t"]}; }) : null
    };
    await Store.putTr(S, el, "index", idx);
  }
  M = ORIG.map(function(m, i){ return {s: m.s, t: clean(idx.mods[i].t), tag: clean(idx.mods[i].tag), steps: null, qs: null}; });
  S.titleShown = clean(idx.title);
  S.recap = idx.recap ? idx.recap.map(function(r){ return {b: clean(r.b), t: clean(r.t)}; }) : null;
}
async function openSubject(id){
  var my = ++NAV;
  var meta = LIB.filter(function(x){ return x.id === id; })[0];
  if (!meta) return;
  renderLoading(L("opening"), titleFor(meta));
  try {
    var mods = meta.built ? LAB : await Store.getModules(id);
    if (my !== NAV) return;
    S = {id: id, title: meta.title, origin: meta.origin, built: !!meta.built, n: mods.length};
    mods.forEach(function(m){ if (!m.qb) m.qb = {medium: (m.qs || []).slice()}; });
    ORIG = mods;
    if (effLang()) renderLoading(L("translating"), L("translatingSub"));
    await applyLang(my);
    if (my !== NAV) return;
    loadProg();
    WAITCB = null; st.view = "home"; render(); updateAI(); window.scrollTo(0, 0);
  } catch (e) {
    if (my !== NAV) return;
    showError(L("errOpen"), e.message, [
      {label: L("retry"), fn: function(){ openSubject(id); }, primary: true},
      {label: L("viewOrig"), fn: function(){ LANG = "orig"; jset("cad-lang", "orig"); openSubject(id); }},
      {label: L("toLib"), fn: toLib}
    ]);
  }
}
async function ensureModule(i, my){
  if (M[i].steps) return;
  var el = effLang();
  var cached = await Store.getTr(S, el, "m" + i);
  if (!cached) {
    var res = await translateMap(flatMod(ORIG[i]), el, setLoadProg);
    if (my !== NAV) return;
    cached = unflatMod(ORIG[i], res);
    await Store.putTr(S, el, "m" + i, cached);
  }
  if (my !== NAV) return;
  M[i].steps = cached.steps.map(function(s){ return {t: clean(s.t), h: clean(s.h)}; });
  M[i].qs = [];
}

/* ---------- Trilha e lição (visual da versão original) ---------- */
function pickQuestion(mi){
  var n = M[mi].qs.length;
  var p = st.pool[mi];
  if (!p || !p.length) {
    p = shuffle(range(n));
    if (n > 1 && p[p.length - 1] === st.last[mi]) { var t = p[0]; p[0] = p[p.length - 1]; p[p.length - 1] = t; }
    st.pool[mi] = p;
  }
  var k = p.pop();
  st.last[mi] = k;
  return k;
}
async function startModule(i){
  st.cur = i; st.step = 0; st.tries = 0; st.pool[i] = null;
  if (!M[i].steps) {
    var my = ++NAV;
    renderLoading(L("translating"), L("translatingSub"), function(){ go("home"); });
    try { await ensureModule(i, my); }
    catch (e) {
      if (my !== NAV) return;
      showError(L("errTr"), e.message, [
        {label: L("retry"), fn: function(){ startModule(i); }, primary: true},
        {label: L("path"), fn: function(){ go("home"); }}
      ]);
      return;
    }
    if (my !== NAV) return;
  }
  save(); go("lesson");
}
function curLevel(){ var l = LS.get("cad-level"); return (l === "easy" || l === "hard") ? l : "medium"; }
function bankFor(i, level){
  var qb = ORIG[i] && ORIG[i].qb;
  return (qb && qb[level] && qb[level].length) ? qb[level] : null;
}
function stepsText(m){
  return (m.steps || []).map(function(s){ return plain(s.t) + ": " + plain(s.h); }).join("\n");
}
async function loadPool(i, level, my){
  var el = effLang(), bank = bankFor(i, level);
  if (bank) {
    if (!el) return bank;
    var key = "qs_" + level + "_" + i;
    var cached = await Store.getTr(S, el, key);
    if (!cached) {
      var res = await translateMap(flatQs(bank), el, setLoadProg);
      if (my !== NAV) return null;
      cached = unflatQs(bank, res);
      await Store.putTr(S, el, key, cached);
    }
    return cached.map(function(q){ return {p: clean(q.p), o: q.o.map(clean), c: q.c, e: clean(q.e)}; });
  }
  var lang = el || S.origin;
  var qx = await Store.getQx(S, i, level, lang);
  if (!qx) {
    var out = await api("/api/questions", {title: plain(S.titleShown || S.title), lang: lang, level: level, module: {title: plain(M[i].t), text: stepsText(M[i])}});
    if (my !== NAV) return null;
    qx = out.questions.map(function(q){ return {p: inl(q.q), o: [inl(q.correct)].concat(q.wrong.map(inl)), c: 0, e: inl(q.why)}; });
    await Store.putQx(S, i, level, lang, qx);
  }
  return qx.map(function(q){ return {p: clean(q.p), o: q.o.map(clean), c: q.c, e: clean(q.e)}; });
}
async function chooseLevel(level){
  LS.set("cad-level", level);
  var i = st.cur, el = effLang();
  var my = ++NAV;
  var needsWork = !(bankFor(i, level) && !el);
  if (needsWork) WAITCB = null, renderLoading(L("lvLoading", {l: L(level === "easy" ? "lvEasy" : level === "hard" ? "lvHard" : "lvMedium")}), L("lvLoadingSub"), function(){ go("level"); });
  try {
    var pool = await loadPool(i, level, my);
    if (my !== NAV || !pool) return;
    M[i].qs = pool; st.pool[i] = null; st.tries = 0;
    openQuiz();
  } catch (x) {
    if (my !== NAV) return;
    showError(L("lvErr"), x.message, [
      {label: L("retry"), fn: function(){ chooseLevel(level); }, primary: true},
      {label: L("back"), fn: function(){ go("level"); }}
    ]);
  }
}
function renderLevel(){
  var m = M[st.cur], cur = curLevel();
  var defs = [["easy", "lvEasy", "lvEasyD"], ["medium", "lvMedium", "lvMediumD"], ["hard", "lvHard", "lvHardD"]];
  app.innerHTML =
    topbar(m, m.steps.length) +
    '<div class="wrap body">' +
      '<p class="crumb">' + kindPill(m) + '<span>' + esc(L("qOf", {n: st.cur + 1})) + '</span></p>' +
      '<h2 class="q">' + esc(L("lvTitle")) + '</h2>' +
      '<p class="lead left">' + esc(L("lvSub")) + '</p>' +
      '<div class="opts" role="group">' + defs.map(function(d){
        return '<button type="button" class="opt lv lv-' + d[0] + (d[0] === cur ? " sel" : "") + '" data-lv="' + d[0] + '"><span class="l">' + (d[0] === "easy" ? "1" : d[0] === "medium" ? "2" : "3") + '</span><span><strong>' + esc(L(d[1])) + '</strong><small>' + esc(L(d[2])) + '</small></span></button>';
      }).join("") + '</div>' +
    '</div>';
  $("#tbback").onclick = function(){ st.step = Math.max(0, m.steps.length - 1); go("lesson"); };
  $("#exit").onclick = function(){ go("home"); };
  app.querySelectorAll(".lv").forEach(function(b){ b.onclick = function(){ chooseLevel(b.getAttribute("data-lv")); }; });
}
function openQuiz(){
  var m = M[st.cur];
  st.qi = pickQuestion(st.cur);
  st.order = shuffle(range(m.qs[st.qi].o.length));
  st.sel = null;
  go("quiz");
}
function topbar(m, idx){
  var total = m.steps.length + 1, segs = "";
  for (var i = 0; i < total; i++) segs += '<i class="' + (i < idx ? "on" : i === idx ? "now" : "") + '"></i>';
  return '<div class="top"><div class="wrap"><button type="button" class="x" id="tbback" aria-label="' + esc(L("back")) + '">' + ICON.back + '</button><div class="segs" role="progressbar" aria-valuemin="1" aria-valuemax="' + total + '" aria-valuenow="' + (idx + 1) + '">' + segs + '</div><button type="button" class="x" id="exit" aria-label="' + esc(L("exit")) + '">' + ICON.x + '</button></div></div>';
}

function renderHome(){
  var all = st.unlocked >= M.length;
  var n = Math.min(st.unlocked, M.length);
  var pct = Math.round(n / M.length * 100);
  var nxt = Math.min(st.unlocked, M.length - 1);
  var cards = M.map(function(m, i){
    var locked = i > st.unlocked, done = i < st.unlocked, cur = i === st.unlocked && !all;
    var badge = done ? '<span class="badge">' + ICON.check + '</span>' : locked ? '<span class="badge lock">' + ICON.lock + '</span>' : "";
    var status = done ? L("review") : cur ? L("cont") : "";
    var label = L("modL", {n: i + 1, t: plain(m.t)}) + (locked ? " " + L("lockedL") : done ? " " + L("doneL") : "");
    return '<button type="button" class="mod' + (done ? " done" : "") + (cur ? " cur" : "") + (locked ? " locked" : "") + '" data-i="' + i + '"' + (locked ? " disabled" : "") + ' aria-label="' + esc(label) + '">' +
      '<span class="node">' + sign(m.s) + badge + '</span>' +
      '<span class="mt">' + kindPill(m) + '<strong>' + m.t + '</strong><span class="meta">' + m.tag + accBadge(i) + '</span></span>' +
      '<span class="st">' + esc(status) + '</span></button>';
  }).join("");
  var ctaLabel = all ? L("reviewAll") : st.unlocked === 0 ? L("start") : L("contN", {n: nxt + 1});
  var kick = S.built ? L("kickLab") : L("kickGen", {n: M.length});
  var sub = (S.built && LANG === "orig") ? L("subLab") : L("subGen");
  app.innerHTML =
    '<div class="wrap hero">' +
      '<div class="topline"><button type="button" class="back" id="tolib">' + ICON.back + '<span>' + esc(L("toLib")) + '</span></button>' + langBar() + '</div>' +
      '<p class="kicker">' + esc(kick) + '</p>' +
      '<h1>' + S.titleShown + '</h1>' +
      '<p class="sub">' + esc(sub) + '</p>' +
      '<div class="stats"><span class="pill">' + ICON.star + esc(L("xp", {n: st.xp})) + '</span><span class="pill">' + esc(L("modsDone", {n: n, m: M.length})) + '</span></div>' +
      '<div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
      homeTools() +
    '</div>' +
    '<div class="wrap path">' + cards + '</div>' +
    '<div class="wrap foot" style="gap:6px;flex-wrap:wrap">' +
      ((st.unlocked > 0 || st.xp > 0) ? '<button type="button" class="btn ghost" id="reset">' + esc(st.confirmReset ? L("confirm") : L("reset")) + '</button>' : "") +
      (!S.built ? '<button type="button" class="btn ghost" id="del" style="color:var(--bad)">' + esc(st.confirmDel ? L("delConfirm") : L("delSub")) + '</button>' : "") +
    '</div>' +
    '<div class="bar"><div class="wrap"><button type="button" class="btn primary wide" id="cta">' + esc(ctaLabel) + '</button></div></div>';
  bindLang(); bindHomeTools();
  $("#tolib").onclick = toLib;
  app.querySelectorAll(".mod").forEach(function(b){ b.onclick = function(){ startModule(parseInt(b.getAttribute("data-i"), 10)); }; });
  $("#cta").onclick = function(){ startModule(all ? 0 : nxt); };
  var rs = $("#reset");
  if (rs) rs.onclick = function(){
    if (!st.confirmReset) { st.confirmReset = true; renderHome(); return; }
    st.confirmReset = false; st.unlocked = 0; st.cur = 0; st.xp = 0; st.pool = {}; st.last = {}; st.step = 0; st.tries = 0; st.sel = null; save(); renderHome();
  };
  var dl2 = $("#del");
  if (dl2) dl2.onclick = async function(){
    if (!st.confirmDel) { st.confirmDel = true; renderHome(); return; }
    var id = S.id;
    try { await Store.remove(id); } catch (e) { st.confirmDel = false; renderHome(); return; }
    toLib();
  };
}

function renderLesson(){
  var m = M[st.cur], step = m.steps[st.step];
  var lastStep = st.step === m.steps.length - 1;
  app.innerHTML =
    topbar(m, st.step) +
    '<div class="wrap body">' +
      '<p class="crumb">' + kindPill(m) + '<span>' + esc(L("modL", {n: st.cur + 1, t: plain(m.t)})) + '</span></p>' +
      speakBtn() +
      '<h2>' + step.t + '</h2>' +
      '<div class="stack">' + step.h + '</div>' +
    '</div>' +
    '<div class="bar"><div class="wrap">' +
      (st.step > 0 ? '<button type="button" class="btn" id="back">' + esc(L("back")) + '</button>' : "") +
      '<button type="button" class="btn primary wide" id="next">' + esc(lastStep ? L("goQ") : L("next")) + '</button>' +
    '</div></div>';
  bindSpeak(step);
  $("#tbback").onclick = function(){ if (st.step > 0) { st.step--; save(); render(); window.scrollTo(0, 0); } else go("home"); };
  $("#exit").onclick = function(){ go("home"); };
  var bk = $("#back");
  if (bk) bk.onclick = function(){ st.step--; save(); render(); window.scrollTo(0, 0); };
  $("#next").onclick = function(){
    if (lastStep) go("level"); else { st.step++; save(); render(); window.scrollTo(0, 0); }
  };
}

function renderQuiz(){
  var m = M[st.cur], q = m.qs[st.qi];
  var opts = st.order.map(function(oi, pos){
    return '<button type="button" class="opt" data-pos="' + pos + '"><span class="l">' + "ABCD".charAt(pos) + '</span><span>' + q.o[oi] + '</span></button>';
  }).join("");
  app.innerHTML =
    topbar(m, m.steps.length) +
    '<div class="wrap body">' +
      '<p class="crumb">' + kindPill(m) + '<span>' + esc(L("qOf", {n: st.cur + 1})) + '</span><button type="button" class="chlv" id="chlv">' + esc(L("lv" + curLevel().charAt(0).toUpperCase() + curLevel().slice(1))) + ' · ' + esc(L("lvChange")) + '</button></p>' +
      '<h2 class="q">' + q.p + '</h2>' +
      '<div class="opts" role="group" aria-label="' + esc(L("alts")) + '">' + opts + '</div>' +
    '</div>' +
    '<div class="bar" id="bar"><div class="wrap"><button type="button" class="btn primary wide" id="verify" disabled>' + esc(L("verify")) + '</button></div></div>';
  $("#tbback").onclick = function(){ go("level"); };
  $("#exit").onclick = function(){ go("home"); };
  $("#chlv").onclick = function(){ go("level"); };
  var btns = app.querySelectorAll(".opt");
  var verify = $("#verify");
  btns.forEach(function(b){
    b.onclick = function(){
      st.sel = parseInt(b.getAttribute("data-pos"), 10);
      btns.forEach(function(x){ x.classList.remove("sel"); x.setAttribute("aria-pressed", "false"); });
      b.classList.add("sel"); b.setAttribute("aria-pressed", "true");
      verify.disabled = false;
    };
  });
  verify.onclick = function(){
    if (st.sel === null) return;
    var okPos = st.order.indexOf(q.c);
    var ok = st.sel === okPos;
    trackAnswer(ok, q);
    btns.forEach(function(x, i){
      x.disabled = true; x.classList.remove("sel");
      if (i === okPos) x.classList.add("right");
      else if (i === st.sel) x.classList.add("wrong");
    });
    var bar = $("#bar");
    if (ok) {
      st.first = st.cur >= st.unlocked;
      st.gained = 0;
      if (st.first) { st.unlocked = st.cur + 1; st.gained = st.tries === 0 ? 20 : 10; st.xp += st.gained; }
      save();
      bar.className = "bar sheet ok";
      bar.setAttribute("role", "status");
      bar.innerHTML = '<div class="wrap"><div><strong>' + esc(L("right")) + '</strong><p>' + q.e + '</p></div><div class="row"><button type="button" class="btn good wide" id="go">' + esc(L("next")) + '</button></div></div>';
      $("#go").onclick = function(){
        if (st.cur === M.length - 1 && st.first) go("all"); else go("done");
      };
      $("#go").focus();
    } else {

/* ---------- Ler texto de imagens (OCR no aparelho, gratuito) ---------- */
var OCRLIB = null;
function loadOcrLib(){
  if (self.Tesseract) return Promise.resolve();
  if (OCRLIB) return OCRLIB;
  OCRLIB = new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = function(){ res(); };
    s.onerror = function(){ OCRLIB = null; rej(new Error("ocr lib")); };
    document.head.appendChild(s);
  });
  return OCRLIB;
}
async function prepImage(file){
  var bmp = await createImageBitmap(file);
  var w = bmp.width, h = bmp.height, big = Math.max(w, h), k = 2600 / big;
  if (k > 2.2) k = 2.2;
  var c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  var x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  var ang = 0;
  try { ang = detectSkew(c); } catch (err) {}
  if (Math.abs(ang) >= 0.4) {
    var rad = ang * Math.PI / 180, cs = Math.abs(Math.cos(rad)), sn = Math.abs(Math.sin(rad));
    var r = document.createElement("canvas");
    r.width = Math.round(c.width * cs + c.height * sn); r.height = Math.round(c.width * sn + c.height * cs);
    var rx = r.getContext("2d");
    rx.fillStyle = "#fff"; rx.fillRect(0, 0, r.width, r.height);
    rx.translate(r.width / 2, r.height / 2); rx.rotate(rad); rx.drawImage(c, -c.width / 2, -c.height / 2);
    c = r; x = rx; x.setTransform(1, 0, 0, 1, 0, 0);
  }
  /* contraste em tons de cinza: desenha o resultado de volta com filtro */
  var o = document.createElement("canvas"); o.width = c.width; o.height = c.height;
  var ox = o.getContext("2d");
  try { ox.filter = "grayscale(1) contrast(1.3)"; } catch (err) {}
  ox.drawImage(c, 0, 0);
  return o;
}
/* Descobre a inclinação das linhas de texto (graus) pela projeção horizontal dos pixels escuros */
function detectSkew(cv){
  var sc = 700 / Math.max(cv.width, cv.height), w = Math.max(1, Math.round(cv.width * sc)), h = Math.max(1, Math.round(cv.height * sc));
  var sm = document.createElement("canvas"); sm.width = w; sm.height = h;
  var sx = sm.getContext("2d"); sx.drawImage(cv, 0, 0, w, h);
  var d = sx.getImageData(0, 0, w, h).data, n = w * h, sum = 0, i;
  for (i = 0; i < n; i++) sum += d[i * 4 + 1];
  var thr = (sum / n) * 0.75, xs = [], ys = [];
  for (i = 0; i < n; i++) if (d[i * 4 + 1] < thr) { xs.push(i % w); ys.push((i / w) | 0); }
  if (xs.length < 400) return 0;
  function score(a){
    var rad = a * Math.PI / 180, cs = Math.cos(rad), sn = Math.sin(rad), off = w * 0.8, bins = new Float32Array(h + Math.ceil(w * 1.6) + 4), m;
    for (m = 0; m < xs.length; m++) bins[Math.max(0, Math.round(xs[m] * sn + ys[m] * cs + off))]++;
    var mean = xs.length / bins.length, v = 0;
    for (m = 0; m < bins.length; m++) v += (bins[m] - mean) * (bins[m] - mean);
    return v;
  }
  var best = 0, bs = -1, a;
  for (a = -12; a <= 12; a += 1) { var sc1 = score(a); if (sc1 > bs) { bs = sc1; best = a; } }
  var c0 = best;
  for (a = c0 - 1; a <= c0 + 1; a += 0.25) { var sc2 = score(a); if (sc2 > bs) { bs = sc2; best = a; } }
  return best;
}
var STOP_PT = "que não para com uma dos das por mais como são seu sua nos nas ao ou também quando foi pelo pela entre sobre".split(" ");
var STOP_IT = "che non per con una della dei delle sono come più nel nella del il gli anche ogni essere dopo nei alla alle dal dalla suo sua tra fra".split(" ");
function langScore(text, list){
  var set = {}; list.forEach(function(w){ set[w] = 1; });
  var ws = String(text || "").toLowerCase().match(/[a-zà-ú]+/g) || [], n = 0;
  ws.forEach(function(w){ if (set[w]) n++; });
  return n;
}
function textOk(text, conf){
  var ws = String(text || "").match(/[A-Za-zÀ-ú]{3,}/g) || [];
  return (ws.length >= 15) || (ws.length >= 6 && conf >= 45);
}
function tidyOcr(t){
  var lines = String(t || "").replace(/\r/g, "").replace(/-\n(?=[a-zà-ú])/g, "").split("\n").map(function(l){ return l.replace(/[ \t]+/g, " ").trim(); });
  var out = [];
  lines.forEach(function(l){
    if (!l) { if (out.length && out[out.length - 1] !== "") out.push(""); return; }
    var prev = out.length ? out[out.length - 1] : "";
    if (prev && !/[.:;!?)”"]$/.test(prev) && /^[a-zà-ú]/.test(l) && prev.length > 40) out[out.length - 1] = prev + " " + l;
    else out.push(l);
  });
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
async function ocrFiles(files, lang, say){
  say(L("imgLoad"));
  await loadOcrLib();
  var prog = 0, workers = {};
  async function getW(code, psm){
    var key = code + psm;
    if (!workers[key]) workers[key] = await Tesseract.createWorker(code, 1, {
      langPath: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/" + code + "/4.0.0_best_int",
      logger: function(m){ if (m && m.status === "recognizing text") prog = Math.round((m.progress || 0) * 100); }
    }, psm ? {tessedit_pageseg_mode: psm} : {});
    return workers[key];
  }
  /* roda leitura automática e leitura em bloco único; fica com a que tem mais palavras reais do idioma */
  async function best(cv, code){
    var cands = [];
    for (var m = 0; m < 2; m++) {
      var r = await (await getW(code, m ? "6" : "")).recognize(cv);
      var t = tidyOcr(r && r.data && r.data.text), conf = (r && r.data && r.data.confidence) || 0;
      var sc = langScore(t, code === "ita" ? STOP_IT : STOP_PT);
      cands.push({t: t, conf: conf, sc: sc, w: (t.match(/[A-Za-zÀ-ú]{3,}/g) || []).length});
    }
    cands.sort(function(a, b){ return (b.sc - a.sc) || (b.w - a.w); });
    return cands[0];
  }
  var primary = lang === "it" ? "ita" : "por", texts = [], timer = null, cur = 0;
  try {
    timer = setInterval(function(){ say(L("imgRead", {n: cur + 1, t: files.length, p: prog})); }, 300);
    for (cur = 0; cur < files.length; cur++) {
      prog = 0; say(L("imgRead", {n: cur + 1, t: files.length, p: 0}));
      var cv = await prepImage(files[cur]);
      var b1 = await best(cv, primary);
      /* idioma errado? se o outro idioma tem bem mais palavras típicas, refaz com ele */
      var other = primary === "ita" ? "por" : "ita";
      var so = langScore(b1.t, other === "ita" ? STOP_IT : STOP_PT);
      if (so >= 6 && so > b1.sc * 1.5) {
        var b2 = await best(cv, other);
        if (b2.sc >= b1.sc) { b1 = b2; primary = other; }
      }
      texts.push(textOk(b1.t, b1.conf) ? b1.t : "");
    }
  } finally {
    if (timer) clearInterval(timer);
    for (var k in workers) { try { await workers[k].terminate(); } catch (err) {} }
  }
  return texts;
}

async function runGen(){

    try {

function words(s){ return (String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").match(/[a-z0-9]{4,}/g)) || []; }
